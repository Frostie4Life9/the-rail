<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17140F" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rail">
<title>The Rail</title>
<link rel="manifest" href="manifest.webmanifest?v=1">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=1">
<link rel="icon" type="image/png" sizes="32x32" href="icons/rail-32.png?v=1">

<style>
/* Rail shares the suite's warm paper palette (Kitchen, Grocery, Lift, DishLog)
   and keeps violet as its own color, taken from its home-screen icon. --sage is
   the old name for "the app's accent"; it stays so the rules below read the same. */
:root{
  --page:#FAF6F0; --surface:#FFFAF2; --raised:#F1EADF; --carpet:#5c5e57; --tile-bg:var(--raised);
  --line:#DDD3C2; --text:#1F1A14; --muted:#7D7262; --sage:#4E3A86; --sage-ink:#FFFAF2;
  --amber:#A86E08; --danger:#A63D40;
  --shadow:0 1px 2px rgba(31,26,20,.04),0 6px 18px rgba(31,26,20,.06);
  --r-tile:8px; --r-sheet:22px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --page:#17140F; --surface:#231F19; --raised:#2C261F;
  --line:#3B342B; --text:#F1EADF; --muted:#A0947F; --sage:#B9A6F2; --sage-ink:#17140F;
  --amber:#E4BC4A; --danger:#E6735F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}}
h1,h2,.sect,.stat b{font-family:"Fraunces",Georgia,serif;font-style:italic;letter-spacing:-.01em}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page);color:var(--text)}
body{font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;min-height:100dvh;padding-bottom:calc(76px + var(--safe-b))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px;border-radius:4px}
img{display:block;max-width:100%}
.wrap{max-width:760px;margin:0 auto;padding:22px var(--sx-gut,16px) 24px}

/* masthead: the date is the headline, set wide */
.mast h1{font-weight:600;font-size:clamp(32px,8.6vw,46px);line-height:1.02;letter-spacing:-.02em}
.mast .sub{color:var(--muted);margin-top:8px;font-size:15px;max-width:60ch}
.mast .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sync{font-size:12px;color:var(--muted);white-space:nowrap;padding-top:6px}
.sync.off{color:var(--amber)}

/* hamper strip */
.hamper{margin:20px 0 6px;display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;font-size:15px;box-shadow:var(--shadow)}
.hamper b{font-weight:650}
.hamper .grow{flex:1;color:var(--muted)}
.hamper .grow b{color:var(--text)}

/* a fit = photo cards floating on a soft glow made from their own photo.
   The rail scrolls sideways; its gutter is widened so the blur isn't clipped. */
.fit{margin-top:30px}
.fit-head{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.fit-head h2{font-weight:600;font-size:24px;line-height:1.15}
.fit-head .n{color:var(--sage);margin-right:8px}
.when{color:var(--muted);font-size:14px;text-align:right;flex-shrink:0;max-width:45%}
.rail{position:relative;margin:4px calc(-1 * var(--sx-gut,16px)) 0;padding:12px var(--sx-gut,16px) 14px;
  display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-inline:var(--sx-gut,16px);scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.piece{flex:0 0 auto;width:118px;scroll-snap-align:start;position:relative;--glow:.6}
.piece .stage{position:relative}
.piece .amb{position:absolute;top:17.3%;left:8.5%;right:8.5%;bottom:-8%;border-radius:20px;overflow:hidden;
  filter:blur(16px) saturate(1.4);opacity:var(--glow);pointer-events:none}
.piece .amb img{width:100%;height:100%;object-fit:cover}
.piece .ph{position:relative;z-index:1;width:118px;height:150px;border-radius:var(--r-tile);overflow:hidden;background:var(--tile-bg)}
.piece .ph img{width:100%;height:100%;object-fit:cover}
/* cut-out item photos (cut/*.webp): garment on a clean card, no carpet */
img[src^="cut/"]{object-fit:contain!important;padding:7%;box-sizing:border-box}
.piece .amb img[src^="cut/"]{padding:0}
.piece .nm{position:relative;z-index:1;font-size:13px;line-height:1.25;margin-top:22px;font-weight:600;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.piece .cl{position:relative;z-index:1;font-size:12px;color:var(--muted);margin-top:2px}
.piece.dirty{--glow:.3}
.piece.dirty .ph{outline:2px dashed var(--amber);outline-offset:-2px}
.piece.dirty .ph img{opacity:.55}
/* gentle bob (Today and Worn only): .on is set while the card is on screen */
@keyframes rail-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes rail-breathe{0%,100%{transform:translateY(0) scale(1);opacity:var(--glow)}
  50%{transform:translateY(2px) scale(.9);opacity:calc(var(--glow) * .7)}}
.rail.bob .piece.on .ph{animation:rail-bob 4.2s ease-in-out var(--d,0s) infinite}
.rail.bob .piece.on .amb{animation:rail-breathe 4.2s ease-in-out var(--d,0s) infinite}
@media (prefers-reduced-motion:reduce){.rail.bob .piece .ph,.rail.bob .piece .amb{animation:none}}
.note{color:var(--sage);margin-top:12px;font-size:15px;max-width:62ch}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border-radius:999px;padding:10px 16px;font-weight:600;font-size:15px;line-height:1.1;
  background:var(--raised);border:1px solid var(--line);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--sage);color:var(--sage-ink);border-color:var(--sage)}
.btn.ghost{background:none}
.btn.small{padding:7px 12px;font-size:14px}
.btn.warn{border-color:var(--amber);color:var(--amber)}
.btn[disabled]{opacity:.5;pointer-events:none}
.worn-badge{display:inline-flex;align-items:center;gap:6px;color:var(--sage);font-weight:600;font-size:15px;padding:10px 0}

.empty{margin-top:28px;padding:22px 18px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
.empty h3{color:var(--text);font-size:18px;font-weight:650;margin-bottom:6px}
.empty .actions{margin-top:16px}

/* section titles inside tabs */
.sect{font-weight:600;font-size:22px;margin:30px 0 12px}

/* closet */
.filters{display:flex;gap:8px;overflow-x:auto;margin-top:18px;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);font-size:14px;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--text);color:var(--page);border-color:var(--text);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:18px 10px;margin-top:22px}
.grid .piece{width:auto}
.grid .piece .ph{width:100%;height:auto;aspect-ratio:4/5}
.piece button.hit{position:absolute;inset:0;z-index:3}
.piece.hidden-item .ph img{filter:grayscale(1);opacity:.4}
.piece.hidden-item .amb{display:none}

/* worn log */
.stats{display:flex;gap:10px;margin-top:20px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.entry{padding:18px 0;border-bottom:1px solid var(--line)}
.entry .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.entry h3{font-size:17px;font-weight:700}
.entry .d{color:var(--muted);font-size:14px;white-space:nowrap}
.entry .strip{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.entry .strip img{width:62px;height:78px;object-fit:cover;border-radius:5px;flex:0 0 auto;background:var(--tile-bg)}
.entry .strip .selfie{width:78px;height:104px;margin-right:4px}
.entry .fb{font-size:14px;margin-top:8px}
.entry .fb.g{color:var(--sage)} .entry .fb.b{color:var(--amber)}
.mini-list{margin-top:8px;color:var(--muted);font-size:14px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  background:color-mix(in srgb,var(--page) 90%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.tabs .in{display:flex;max-width:760px;width:100%}
nav.tabs button{flex:1;padding:10px 0 12px;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button[aria-current=page]{color:var(--sage)}
nav.tabs svg{width:24px;height:24px}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;max-height:92dvh;overflow:auto;background:var(--surface);
  border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:10px 16px calc(20px + var(--safe-b));border:1px solid var(--line);border-bottom:0;box-shadow:0 -12px 40px -18px rgba(0,0,0,.4);
  transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:760px;margin:0 auto}
.sheet.on{transform:none}
.sheet{overscroll-behavior:contain}
.grab{touch-action:none}
.picker .sel img{outline:3px solid var(--sage);outline-offset:-3px}
.picker .sel::after{content:"✓";position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--sage);color:var(--sage-ink);
  font-size:13px;font-weight:700;display:grid;place-items:center}
.picked{display:flex;gap:8px;overflow-x:auto;margin-top:14px;padding-bottom:4px;min-height:84px;align-items:flex-start}
.picked button{flex:0 0 auto;position:relative;width:60px}
.picked img{width:60px;height:75px;object-fit:cover;border-radius:6px;background:var(--tile-bg)}
.picked button::after{content:"✕";position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--text);color:var(--surface);
  font-size:10px;display:grid;place-items:center}
.picked .hint{color:var(--muted);font-size:14px;align-self:center}
.days{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.days input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:15px;color:var(--text)}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:26px;font-weight:600}
.sheet .lead{color:var(--muted);font-size:14px;margin-top:4px}
.rows{margin-top:16px}
.prow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.prow img{width:52px;height:64px;object-fit:cover;border-radius:5px;background:var(--tile-bg)}
.prow .t{flex:1;min-width:0}
.prow .t b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .t span{color:var(--muted);font-size:13px}
.prow .t .warn{color:var(--amber)}
label.f{display:block;margin-top:16px;font-size:14px;color:var(--muted)}
label.f input,label.f textarea,label.f select{display:block;width:100%;margin-top:6px;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;font-size:16px;color:var(--text)}
label.f textarea{min-height:64px;resize:vertical}
.photo-pick{margin-top:16px;display:flex;gap:12px;align-items:center}
.photo-pick img{width:72px;height:96px;object-fit:cover;border-radius:8px}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:12px 8px;margin-top:14px}
.picker button{text-align:left;position:relative}
.picker img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:6px;background:var(--tile-bg)}
.picker span{display:block;font-size:12px;margin-top:4px;line-height:1.2}
.picker .dirty img{opacity:.45;outline:2px dashed var(--amber);outline-offset:-2px}
.picker .dirty span{color:var(--amber)}
.sheet-actions{display:flex;gap:10px;margin-top:22px;position:sticky;bottom:calc(-20px - var(--safe-b));
  background:var(--surface);padding:12px 0 calc(8px + var(--safe-b))}
.sheet-actions .btn{flex:1;padding:13px}

.toast{position:fixed;left:50%;bottom:calc(88px + var(--safe-b));transform:translateX(-50%);z-index:90;background:var(--text);
  color:var(--page);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;
  pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}
.err{color:var(--danger);font-size:14px;margin-top:10px}
.settings p{color:var(--muted);font-size:15px;margin-top:8px;max-width:60ch}
.settings code{background:var(--raised);padding:1px 5px;border-radius:4px;font-size:14px}
.ver{color:var(--muted);font-size:13px;margin-top:28px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
<!-- suite:css v9 · shared by Kitchen, Grocery, Lift, DishLog, Protocol, Rail, Game Log, Playback — edit tools/suite.py in the kitchen repo, not here -->
<style id="suite-css">
/* App colors come from each app's home-screen icon, so the bar, the icon and
   the page all agree. The tab for every app carries its own color, so the
   whole set reads as one color-coded system wherever you are in it. */
.sx-bar{
  --sx-kitchen:#7A2E1E; --sx-grocery:#2D5840; --sx-lift:#A8522B; --sx-dishlog:#6A2347; --sx-protocol:#1E3550; --sx-rail:#3A2A63; --sx-gamelog:#242B5C; --sx-playback:#124C50;
  --sx-on:#FFF8EF;
  --sx-paper:#FAF6F0; --sx-ink:#1F1A14; --sx-dim:#7D7262; --sx-line:#DDD3C2; --sx-hover:#EFE7DA;
}
@media (prefers-color-scheme:dark){ .sx-bar:not(.sx-light){
  --sx-kitchen:#E8987C; --sx-grocery:#7CC39A; --sx-lift:#EE9C66; --sx-dishlog:#DD8DB2; --sx-protocol:#5FE6B0; --sx-rail:#B9A6F2; --sx-gamelog:#F5B63F; --sx-playback:#6FD3C6;
  --sx-on:#15120E;
  --sx-paper:#17140F; --sx-ink:#F1EADF; --sx-dim:#A0947F; --sx-line:#3B342B; --sx-hover:#2A251E;
}}
.sx-bar.sx-dark{
  --sx-kitchen:#E8987C; --sx-grocery:#7CC39A; --sx-lift:#EE9C66; --sx-dishlog:#DD8DB2; --sx-protocol:#5FE6B0; --sx-rail:#B9A6F2; --sx-gamelog:#F5B63F; --sx-playback:#6FD3C6;
  --sx-on:#15120E;
}
/* layout tokens every app's own layout lines up with. No width cap: on a
   computer the apps use the whole window; each app decides how many columns. */
:root{ --sx-max:100000px; --sx-gut:clamp(16px,2vw,40px); --sx-barh:56px; }

.sx-bar{position:relative;z-index:40;background:var(--sx-paper);border-bottom:1px solid var(--sx-line);
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;color:var(--sx-ink)}
.sx-in{max-width:var(--sx-max);margin:0 auto;box-sizing:border-box;min-height:52px;
  padding:calc(8px + env(safe-area-inset-top,0px)) var(--sx-gut) 8px;display:flex;align-items:center;gap:18px}
.sx-id{display:flex;align-items:center;gap:10px;flex:0 1 auto;min-width:0}
.sx-tile{width:32px;height:32px;border-radius:7.5px;display:block;background:var(--app);flex:0 0 auto;
  box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 2px 6px -2px rgba(0,0,0,.3)}
.sx-name{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:600;font-size:21px;letter-spacing:-.01em;line-height:1;color:var(--sx-ink);white-space:nowrap}
.sx-t svg,.sx-gbtn svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* phone: app name on the left, the grid button on the right */
.sx-gbtn{margin-left:auto;flex:0 0 auto;width:40px;height:40px;border-radius:12px;border:1px solid var(--sx-line);background:transparent;
  color:var(--sx-dim);display:grid;place-items:center;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;transition:background .15s,color .15s,scale .22s var(--sx-spring)}
.sx-gbtn svg{width:19px;height:19px}
.sx-gbtn[aria-expanded="true"]{background:var(--sx-hover);color:var(--sx-ink)}
.sx-menu{position:fixed;inset:0;z-index:300}
.sx-menu[hidden]{display:none}
.sx-pop{position:absolute;top:calc(56px + env(safe-area-inset-top,0px));right:var(--sx-gut);width:min(340px,calc(100vw - 2 * var(--sx-gut)));
  box-sizing:border-box;padding:10px;border-radius:22px;background:var(--sx-paper);border:1px solid var(--sx-line);
  box-shadow:0 24px 60px -18px rgba(0,0,0,.45);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  transform-origin:top right;animation:sx-pop .2s cubic-bezier(.2,.9,.3,1.2)}
@keyframes sx-pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.sx-cell{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px 10px;border-radius:16px;text-decoration:none;
  color:var(--sx-ink);font:700 12px/1.1 'Manrope',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.sx-cell img{width:54px;height:54px;border-radius:12.5px;display:block;background:var(--c);
  box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 3px 8px -3px rgba(0,0,0,.35)}
.sx-cell:active{background:var(--sx-hover)}
.sx-cell[aria-current="page"]{background:var(--sx-hover)}
.sx-cell[aria-current="page"] b{color:var(--sx-dim);font-weight:700}
.sx-cell b{font-weight:700}
.sx-tabs{display:none}
@media (prefers-reduced-motion:reduce){.sx-pop{animation:none}}

/* computer and tablet: the full bar of tabs */
.sx-t{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px 0 11px;box-sizing:border-box;
  border-radius:999px;border:1px solid transparent;background:transparent;color:var(--sx-dim);text-decoration:none;
  font:700 12.5px/1 'Manrope',system-ui,sans-serif;letter-spacing:.02em;white-space:nowrap;transition:background .15s,color .15s,border-color .15s,scale .22s var(--sx-spring)}
.sx-t svg{width:16px;height:16px;color:var(--c);flex:0 0 auto}
.sx-t:hover{background:var(--sx-hover);color:var(--sx-ink)}
.sx-t:focus-visible,.sx-gbtn:focus-visible,.sx-cell:focus-visible{outline:2px solid var(--app);outline-offset:2px}
.sx-t[aria-current="page"]{background:var(--c);border-color:var(--c);color:var(--sx-on)}
.sx-t[aria-current="page"] svg{color:inherit}
@media (min-width:900px){
  .sx-bar{position:sticky;top:0;z-index:70;background:color-mix(in srgb,var(--sx-paper) 88%,transparent);
    -webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
  .sx-in{min-height:var(--sx-barh)}
  .sx-tabs{display:flex;gap:6px;margin-left:auto;flex:0 1 auto;min-width:0}
  .sx-gbtn,.sx-menu{display:none!important}
}
@media print{.sx-bar{display:none}}

/* Moving between apps: they all live on frostie4life9.github.io, so the
   browser can cross-fade one page into the next instead of cutting. The bar
   is its own layer, so it holds still and just changes color and name,
   while the page underneath settles in. Safari 18.2+ and Chrome; anything
   older just navigates as before. */
@view-transition{navigation:auto}
.sx-bar{view-transition-name:sx-bar}
::view-transition-group(sx-bar){animation-duration:.4s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
::view-transition-old(root){animation:sx-leave .2s ease-in both}

<script>
/* suite motion helpers (window.SX), shared by every app. Each one is a
   no-op extra: if the browser can't animate or you've asked for reduced
   motion, the change just happens, exactly as it did before.
     SX.flip(root, sel, change)  redraw a list and let the items that stay
                                 glide to their new spots; new ones fade in
     SX.enter(root, sel, dir)    play a short staggered entrance on fresh content
     SX.pill(row, activeSel)     slide a highlight to the selected tab/chip
     SX.expand(el, open, apply)  open or close a block by its height
     SX.morph(root, sel, prop, change)  bars and meters ease to their new size

(function(){
  if(window.SX) return;
  var mq=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):null;
  var E='cubic-bezier(.2,.8,.2,1)', SPRING='cubic-bezier(.3,1.25,.5,1)';
  function still(){ return !!(mq&&mq.matches) || typeof Element.prototype.animate!=='function'; }
  function q(x){ return typeof x==='string'?document.querySelector(x):x; }
  function keyOf(el,kf){ return kf?kf(el):(el.getAttribute('data-sx-key')||el.getAttribute('data-id')||el.getAttribute('data-k')||el.id||null); }

    try{ el.getAnimations({subtree:true}).forEach(function(a){ if(a.animationName) a.cancel(); }); }catch(e){} }

  function flip(root,sel,change,o){
    o=o||{}; root=q(root);
    if(!root || still()){ change(); return; }
    var before={}, vh=window.innerHeight;
    root.querySelectorAll(sel).forEach(function(el){
      var k=keyOf(el,o.key); if(k==null || before[k]) return;
      var r=el.getBoundingClientRect(); if(!r.width && !r.height) return;
      before[k]=r;
    });
    change();
    var seen={}, n=0;
    root.querySelectorAll(sel).forEach(function(el){
      var k=keyOf(el,o.key); if(k==null || seen[k]) return; seen[k]=1;
      var b=before[k], r=el.getBoundingClientRect();
      if(!r.width && !r.height) return;
      if(r.bottom<-40 || r.top>vh+40){ if(b) quietCss(el); return; }
      if(b){
        quietCss(el);
        var dx=b.left-r.left, dy=b.top-r.top;
        if(Math.abs(dx)<1 && Math.abs(dy)<1) return;
        if(Math.abs(dy)>vh) dy=dy>0?vh*.5:-vh*.5;

                   {duration:260,delay:Math.min(n++,8)*24,easing:E,fill:'backwards'});

    });
  }

  function enter(root,sel,dir,o){
    o=o||{}; root=q(root); if(!root || still()) return;
    var els=sel?root.querySelectorAll(sel):root.children, vh=window.innerHeight, i=0;
    var from=dir==='left'?'-18px 0':dir==='right'?'18px 0':dir==='none'?'0 0':'0 8px';
    Array.prototype.forEach.call(els,function(el){
      if(el.classList && el.classList.contains('sx-pill')) return;
      var r=el.getBoundingClientRect(); if(r.bottom<0 || r.top>vh || !r.height) return;
      quietCss(el);

                 {duration:o.dur||300,delay:Math.min(i++,10)*(o.step==null?30:o.step),easing:E,fill:'backwards'});
    });
  }

  var rows=[];
  function pill(row,activeSel,o){
    row=q(row); if(!row) return;
    var rec=null; rows.forEach(function(x){ if(x.row===row) rec=x; });
    if(!rec){ rec={row:row, sel:activeSel, last:null, o:o||{}}; rows.push(rec); watch(rec); }
    rec.sel=activeSel||rec.sel; place(rec,true);

  function place(rec,animate){
    var row=rec.row, p=row.querySelector(':scope > .sx-pill');

    var a=row.querySelector(rec.sel);

    var now={x:a.offsetLeft, y:a.offsetTop, w:a.offsetWidth, h:a.offsetHeight}, last=rec.last;
    rec.last=now;
    p.style.opacity='1'; p.style.width=now.w+'px'; p.style.height=now.h+'px';
    p.style.transform='translate('+now.x+'px,'+now.y+'px)';
    if(animate && last && !still() && (last.x!==now.x || last.y!==now.y || last.w!==now.w)){
      p.animate([{transform:'translate('+last.x+'px,'+last.y+'px)',width:last.w+'px',height:last.h+'px'},

  function expand(el,open,apply){
    el=q(el); if(!el){ apply(open); return; }
    if(el._sx){ el._sx.cancel(); el._sx=null; }
    if(still()){ apply(open); return; }

      f={height:h+'px',paddingTop:cs.paddingTop,paddingBottom:cs.paddingBottom,marginTop:cs.marginTop,marginBottom:cs.marginBottom,opacity:1};
      el.style.overflow='hidden';
      a=el.animate([{height:'0px',paddingTop:'0px',paddingBottom:'0px',marginTop:'0px',marginBottom:'0px',opacity:0},f],{duration:300,easing:E});
    } else {
      cs=getComputedStyle(el); h=el.offsetHeight; if(!h){ apply(false); return; }
      f={height:h+'px',paddingTop:cs.paddingTop,paddingBottom:cs.paddingBottom,marginTop:cs.marginTop,marginBottom:cs.marginBottom,opacity:1};
      el.style.overflow='hidden';
      a=el.animate([f,{height:'0px',paddingTop:'0px',paddingBottom:'0px',marginTop:'0px',marginBottom:'0px',opacity:0}],{duration:240,easing:E});
    }
    el._sx=a;
    a.onfinish=function(){ el._sx=null; el.style.overflow=''; if(!open) apply(false); };
    a.oncancel=function(){ el.style.overflow=''; };
  }

  /* redraw something whose bars or meters are set inline (width:40%), and
     let each one ease from where it was instead of snapping */
  function morph(host,sel,prop,change){
    host=q(host); if(!host){ change(); return; }
    var old=Array.prototype.map.call(host.querySelectorAll(sel),function(e){ return e.style[prop]; });
    change();
    if(still()) return;
    var now=host.querySelectorAll(sel), to=Array.prototype.map.call(now,function(e){ return e.style[prop]; });
    Array.prototype.forEach.call(now,function(e,i){ if(old[i]===to[i]) return; e.style.transition='none'; e.style[prop]=old[i]!=null&&old[i]!==''?old[i]:'0'; });
    void host.offsetWidth;
    Array.prototype.forEach.call(now,function(e,i){ e.style.transition=''; e.style[prop]=to[i]; });
  }

  function bump(el){
    el=q(el); if(!el || still()) return;
    el.animate([{scale:1},{scale:1.08},{scale:1}],{duration:320,easing:SPRING});
  }

  /* <details> sections open and close by height instead of snapping.
     The toggle still happens for real, so anything listening for it works. */
  document.addEventListener('click',function(e){
    var sm=e.target.closest && e.target.closest('summary'); if(!sm || e.defaultPrevented) return;
    var d=sm.parentElement; if(!d || d.tagName!=='DETAILS' || d.hasAttribute('data-sx-still') || still()) return;
    e.preventDefault();
    if(d._sx){ d._sx.cancel(); d._sx=null; }
    var from=d.offsetHeight, opening=!d.open, to;
    d.style.overflow='hidden';
    if(opening){ d.open=true; to=d.offsetHeight; }
    else { d.open=false; to=d.offsetHeight; d.open=true; }
    var a=d.animate([{height:from+'px'},{height:to+'px'}],{duration:opening?320:240,easing:E});
    d._sx=a;
    a.onfinish=function(){ d._sx=null; d.style.overflow=''; if(!opening) d.open=false; };
    a.oncancel=function(){ d.style.overflow=''; };
    if(opening){ Array.prototype.forEach.call(d.children,function(c){ if(c!==sm) c.animate([{opacity:0},{opacity:1}],{duration:260,delay:60,easing:E,fill:'backwards'}); }); }
  });

  window.SX={still:still, flip:flip, enter:enter, pill:pill, expand:expand, morph:morph, bump:bump};
})();

  async req(path, opts = {}, raw = false) {
    let res;
    try { res = await fetch(this.url(path) + (opts.method ? "" : `?ref=${encodeURIComponent(cfg.branch)}&t=${Date.now()}`), {cache:"no-store", ...opts, headers:{...this.headers(raw), ...(opts.headers || {})}}); }
    catch { throw new GhError(0, "offline"); }
    if (!res.ok) {
      let m = res.statusText; try { m = (await res.json()).message || m; } catch {}
      throw new GhError(res.status, m);
    }
    return res;
  },
  async getJson(path) {
    try {
      const j = await (await this.req(path)).json();
      const bytes = Uint8Array.from(atob(j.content.replace(/\n/g, "")), c => c.charCodeAt(0));
      return {data: JSON.parse(new TextDecoder().decode(bytes)), sha: j.sha};
    } catch (e) { if (e.status === 404) return {data:null, sha:null}; throw e; }
  },
  async getBlob(path) { return (await this.req(path, {}, true)).blob(); },
  async put(path, b64, sha, message) {
    const body = {message, content:b64, branch:cfg.branch}; if (sha) body.sha = sha;
    const j = await (await this.req(path, {method:"PUT", body:JSON.stringify(body), headers:{"Content-Type":"application/json"}})).json();
    return j.content.sha;
  },
};
function b64utf8(str) { const b = new TextEncoder().encode(str); let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(s); }
async function blobToB64(blob) { const r = new FileReader(); return new Promise((ok, no) => { r.onload = () => ok(r.result.split(",")[1]); r.onerror = no; r.readAsDataURL(blob); }); }

/* ---------------- state ---------------- */
const S = ls("rail.state") || {wardrobe:null, log:null, laundry:null, shas:{}, synced:null};
let queue = ls("rail.queue") || [];
let online = true, syncing = false, tab = "today";
const saveState = () => ls("rail.state", S);
const saveQueue = () => ls("rail.queue", queue);

const DEFAULTS = {
  "wardrobe.json": () => ({next_code:9001, items:[]}),
  "fit-log.json": () => ({planned:[], worn:[]}),
  "laundry.json": () => ({wash_after:{tee:1,collared:2,knit:3,crewneck:3,hoodie:4,outerwear:10,trousers:4,joggers:3,shorts:2,cap:0,shoes:0,socks:1}, last_full:null, washed:{}}),
};
const KEY = {"wardrobe.json":"wardrobe","fit-log.json":"log","laundry.json":"laundry"};

async function pull() {
  const got = await Promise.all(FILES.map(f => GH.getJson(f)));
  FILES.forEach((f, i) => { S[KEY[f]] = got[i].data || DEFAULTS[f](); S.shas[f] = got[i].sha; });
  S.synced = nowIso(); saveState();
}

/* Every change is a named, replayable operation. Applied locally at once, then
   pushed: re-read the file, apply again on the fresh copy, write with its sha.
   A conflict just means "someone else wrote first" — re-read and retry. */
const OPS = {
  wore: {file:"fit-log.json", apply(log, p) {
    log.worn = log.worn.filter(x => !(x.date === p.rec.date && x.name === p.rec.name));
    log.worn.push(p.rec); log.worn.sort((a, b) => (b.date + (b.logged_at||"")).localeCompare(a.date + (a.logged_at||"")));
  }},
  unwear: {file:"fit-log.json", apply(log, p) { log.worn = log.worn.filter(x => !(x.date === p.date && x.name === p.name)); }},
  laundry: {file:"laundry.json", apply(l, p) { l.last_full = p.at; l.washed = {}; }},
  washItem: {file:"laundry.json", apply(l, p) { l.washed = l.washed || {}; l.washed[p.code] = p.at; }},
  addItem: {file:"wardrobe.json", apply(w, p) {
    const used = new Set(w.items.map(i => i.code));
    let code = Math.max(w.next_code || 9001, ...w.items.map(i => +i.code || 0).filter(n => n >= 9001).map(n => n + 1));
    if (p.item.code && !used.has(p.item.code)) code = +p.item.code;
    while (used.has(String(code))) code++;
    p.item.code = String(code); w.items.push(p.item); w.next_code = code + 1;
  }},
  setItem: {file:"wardrobe.json", apply(w, p) { const it = w.items.find(i => i.code === p.code); if (it) Object.assign(it, p.patch); }},
};

function run(op, payload) {
  const def = OPS[op], key = KEY[def.file];
  S[key] = S[key] || DEFAULTS[def.file]();
  def.apply(S[key], payload); saveState();
  queue.push({op, payload, id: Math.random().toString(36).slice(2)}); saveQueue();
  render(); flush();
}

async function flush() {
  if (syncing || !configured()) return;
  syncing = true; setSync();
  try {
    while (queue.length) {
      const q = queue[0], def = OPS[q.op];
      if (q.payload.upload) {            // photo travels with the op that references it
        const u = q.payload.upload;
        try { await GH.put(u.path, u.b64, null, `Photo ${u.path}`); }
        catch (e) { if (e.status !== 422) throw e; }   // 422 = already uploaded on an earlier try
        delete q.payload.upload; saveQueue();
      }
      for (let attempt = 0; ; attempt++) {
        const fresh = await GH.getJson(def.file);
        const data = fresh.data || DEFAULTS[def.file]();
        def.apply(data, q.payload);
        try {
          S.shas[def.file] = await GH.put(def.file, b64utf8(JSON.stringify(data, null, 1) + "\n"), fresh.sha, `${q.op}: ${summary(q)}`);
          S[KEY[def.file]] = data; break;
        } catch (e) { if ((e.status === 409 || e.status === 422) && attempt < 4) continue; throw e; }
      }
      queue.shift(); saveQueue();
    }
    await pull(); online = true;
  } catch (e) {
    online = e.status !== 0 ? online : false;
    if (e.status === 401 || e.status === 403 || e.status === 404) toast(`Sync stopped: ${e.message}. Check Settings.`);
  } finally { syncing = false; saveState(); setSync(); render(); }
}
function summary(q) {
  const p = q.payload;
  return {wore:() => `${p.rec.date} ${p.rec.name}`, unwear:() => `${p.date} ${p.name}`, laundry:() => "full laundry",
    washItem:() => p.code, addItem:() => p.item.name, setItem:() => p.code}[q.op]?.() || q.op;
}

/* ---------------- derived ---------------- */
const items = () => (S.wardrobe?.items || []).filter(i => !i.retired);
const item = code => (S.wardrobe?.items || []).find(i => i.code === code);
function wearsSinceWash(code) {
  const l = S.laundry || DEFAULTS["laundry.json"]();
  const reset = [l.last_full, (l.washed || {})[code]].filter(Boolean).sort().pop() || "";
  return (S.log?.worn || []).filter(x => x.items.includes(code) && (x.logged_at || x.date + "T12:00:00+00:00") > reset).length;
}
function isDirty(code) {
  const it = item(code); if (!it) return false;
  const lim = (S.laundry?.wash_after || {})[it.type] || 0;
  return lim > 0 && wearsSinceWash(code) >= lim;
}
const hamper = () => items().filter(i => isDirty(i.code));
const todayPlan = () => (S.log?.planned || []).find(p => p.date === todayStr());
const wornOn = d => (S.log?.worn || []).filter(x => x.date === d);

/* ---------------- images ---------------- */
const CUT_V = 2;   // bump when cut/ photos are re-made: the service worker caches them forever by URL
const imgCache = new Map();
function photoSrc(path) {
  if (!path) return "";
  if (path.startsWith("tiles/")) return "cut/" + path.slice(6).replace(/\.jpg$/, ".webp") + "?v=" + CUT_V;   // cut-out version, background removed
  if (path.startsWith("blob:") || path.startsWith("data:")) return path;
  if (imgCache.has(path)) return imgCache.get(path);
  imgCache.set(path, "");
  loadPrivatePhoto(path).then(u => { if (u) { imgCache.set(path, u); document.querySelectorAll(`img[data-p="${CSS.escape(path)}"]`).forEach(i => i.src = u); } });
  return "";
}
async function loadPrivatePhoto(path) {
  const key = new Request(`/__private/${path}`);
  try {
    const c = await caches.open("rail-private");
    let r = await c.match(key);
    if (!r && configured()) { const b = await GH.getBlob(path); r = new Response(b); await c.put(key, r.clone()); }
    return r ? URL.createObjectURL(await r.blob()) : "";
  } catch { return ""; }
}
const img = (path, alt = "", cls = "") => `<img ${cls ? `class="${cls}"` : ""} data-p="${esc(path)}" src="${esc(photoSrc(path))}" alt="${esc(alt)}" loading="lazy" decoding="async">`;

async function compress(file, max = 1400) {
  const bmp = await createImageBitmap(file, {imageOrientation:"from-image"});
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(ok => c.toBlob(ok, "image/jpeg", .82));
}

/* ---------------- ui helpers ---------------- */
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2600); }
function setSync() {
  const el = $("#sync"); if (!el) return;
  el.className = "sync" + (!online || queue.length ? " off" : "");
  el.textContent = syncing ? "Syncing…" : !online ? `Offline · ${queue.length} to sync` : queue.length ? `${queue.length} to sync` : S.synced ? "Synced" : "";
}
function openSheet(html, onMount) {
  const sh = $("#sheet"), sc = $("#scrim");
  sh.innerHTML = `<div class="grab"></div>${html}`; sh.hidden = sc.hidden = false;
  requestAnimationFrame(() => { sh.classList.add("on"); sc.classList.add("on"); });
  sc.onclick = closeSheet; onMount && onMount(sh);
  const f = sh.querySelector("button,input"); f && f.focus({preventScroll:true});
}
function closeSheet() {
  const sh = $("#sheet"), sc = $("#scrim");
  sh.classList.remove("on"); sc.classList.remove("on");
  setTimeout(() => { sh.hidden = sc.hidden = true; sh.innerHTML = ""; }, 250);
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });
// swipe a sheet down to close it (from the top of its content, or from the grab bar anywhere)
(() => {
  const sh = $("#sheet"), sc = $("#scrim");
  let y0 = null, x0 = 0, dy = 0, t0 = 0, drag = false;
  sh.addEventListener("touchstart", e => {
    if (e.touches.length !== 1) { y0 = null; return; }
    const fromGrab = !!e.target.closest(".grab");
    if (!fromGrab && sh.scrollTop > 0) { y0 = null; return; }
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0; t0 = Date.now(); drag = false;
  }, {passive: true});
  sh.addEventListener("touchmove", e => {
    if (y0 === null) return;
    const t = e.touches[0], d = t.clientY - y0, dx = t.clientX - x0;
    if (!drag) {
      if (d > 8 && Math.abs(d) > Math.abs(dx) * 1.2) { drag = true; sh.style.transition = "none"; sc.style.transition = "none"; }
      else if (Math.abs(d) > 8 || Math.abs(dx) > 8) { y0 = null; return; }
      else return;
    }
    dy = Math.max(0, d); e.preventDefault();
    sh.style.transform = `translateY(${dy}px)`; sc.style.opacity = String(Math.max(0, 1 - dy / 450));
  }, {passive: false});
  const end = () => {
    if (drag) {
      const fast = dy / Math.max(1, Date.now() - t0) > 0.6;
      sh.style.transition = sc.style.transition = "";
      if (dy > 110 || (fast && dy > 40)) closeSheet();
      sh.style.transform = ""; sc.style.opacity = "";
    }
    y0 = null; drag = false;
  };
  sh.addEventListener("touchend", end); sh.addEventListener("touchcancel", end);
})();

// Stagger the bob so cards in a row never move in step (seconds into the 4.2s loop).
const BOB_DELAYS = [0, -1.1, -2.3, -3.2, -0.6, -1.7, -2.8, -3.7];
function pieceHtml(code, {extra = "", i = 0} = {}) {
  const it = item(code);
  if (!it) return `<div class="piece"><div class="stage"><div class="ph"></div></div><div class="nm">Unknown ${esc(code)}</div></div>`;
  const dirty = isDirty(code);
  return `<div class="piece${dirty ? " dirty" : ""}${it.avoid ? " hidden-item" : ""}" data-sx-key="${esc(code)}" style="--d:${BOB_DELAYS[i % BOB_DELAYS.length]}s">${extra}
    <div class="stage"><div class="amb" aria-hidden="true">${img(it.photo, "")}</div><div class="ph">${img(it.photo, it.name)}</div></div>
    <div class="nm">${esc(it.name)}</div><div class="cl">${dirty ? "In the hamper" : esc(it.colour)}${it.uncalibrated && !dirty ? " ⚠" : ""}</div></div>`;
}

// Only cards on screen bob: an observer toggles .on, so off-screen rails cost nothing.
// With Reduce Motion on, nothing is observed and nothing moves.
const bobMotion = window.matchMedia ? matchMedia("(prefers-reduced-motion: reduce)") : null;
let bobIO = null;
function watchBob() {
  if (bobIO) { bobIO.disconnect(); bobIO = null; }
  if ((bobMotion && bobMotion.matches) || !("IntersectionObserver" in window)) return;
  const cards = document.querySelectorAll(".rail.bob .piece");
  if (!cards.length) return;
  bobIO = new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle("on", e.isIntersecting)), {rootMargin: "40px"});
  cards.forEach(c => bobIO.observe(c));
}
if (bobMotion && bobMotion.addEventListener) bobMotion.addEventListener("change", () => {
  if (bobMotion.matches) document.querySelectorAll(".rail.bob .piece.on").forEach(c => c.classList.remove("on"));
  watchBob();
});

  const v = $("#view");

}

function mast(title, sub) {

}

function viewToday() {
  const d = new Date(), plan = todayPlan(), worn = wornOn(todayStr());
  const title = d.toLocaleDateString("en-US", {weekday:"long"}) + ", " + d.toLocaleDateString("en-US", {month:"short", day:"numeric"});
  const h = hamper();
  let out = mast(title, plan ? plan.subtitle.replace(/^Provo:\s*/, "") : "");

  else if (!plan) {

    });
    out += `<div class="actions" style="margin-top:28px"><button class="btn ghost" data-act="log-own">Wore something else? Build it</button></div>`;
  }

}

let closetFilter = "all";

  const chips = [["all", `All ${all.length}`], ...SLOTS, ["hamper", `Hamper ${hamper().length}`]];

function viewWorn() {

/* ---------------- flows ---------------- */

      <label class="f">What worked?<textarea id="w-good" placeholder="Optional">${esc(existing?.worked || "")}</textarea></label>
      <label class="f">What didn't?<textarea id="w-bad" placeholder="Optional">${esc(existing?.didnt || "")}</textarea></label>

    if ($("#w-name", sh)) st.name = $("#w-name", sh).value;
  };
  openSheet("", sh => {
    const fill = () => { paint(sh); $("#w-good", sh).value = st.worked || ""; $("#w-bad", sh).value = st.didnt || ""; };
    const bind = () => { sh.onchange = onChange; sh.onclick = onClick; };
    paint(sh);
    const onChange = async e => {
      if (e.target.id !== "w-photo" || !e.target.files[0]) return;
      keep(sh); st.photo = await compress(e.target.files[0]); st.photoUrl = URL.createObjectURL(st.photo);
      fill();
    };
    const onClick = async e => {
      const b = e.target.closest("[data-w]"); if (!b) return;
      const act = b.dataset.w, i = +b.dataset.i;
      const repaint = () => { keep(sh); fill(); };
      if (act === "cancel") return closeSheet();
      if (act === "drop") { keep(sh); st.items.splice(i, 1); return repaint(); }
      if (act === "swap" || act === "add") {
        keep(sh);
        const slot = act === "swap" ? item(st.items[i])?.slot : null;
        return pickItem(sh, slot, act === "swap" ? st.items[i] : null, code => {
          if (code) { if (act === "swap") st.items[i] = code; else if (!st.items.includes(code)) st.items.push(code); }
          bind(); fill();
        });
      }
      if (act === "unlog") { run("unwear", {date, name: existing.name}); closeSheet(); return toast("Log removed"); }
      if (act === "save") {
        keep(sh);
        const rec = {date, name: (st.name || "").trim() || "Worn fit", items: st.items, uncatalogued: existing?.uncatalogued || [],
          from_plan: n ? `${date}#${n}` : null, occasion: when || "", worked: (st.worked || "").trim(), didnt: (st.didnt || "").trim(),
          notes: existing?.notes || "", photo: existing?.photo || null, logged_at: existing?.logged_at || nowIso(), source: "app"};
        const payload = {rec};
        if (st.photo) {
          const slug = rec.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 30) || "fit";
          rec.photo = `photos/worn/${date}_${slug}-${Math.random().toString(36).slice(2, 6)}.jpg`;
          payload.upload = {path: rec.photo, b64: await blobToB64(st.photo)};
          imgCache.set(rec.photo, st.photoUrl);
        }
        if (existing && existing.name !== rec.name) run("unwear", {date, name: existing.name});
        run("wore", payload); closeSheet(); toast(existing ? "Saved" : "Logged. Have a good one.");
      }
    };
    bind();
  });
}

const SLOT_ORDER = ["layer", "top", "bottom", "socks", "shoes", "cap"];
const bySlot = codes => [...codes].sort((a, b) => SLOT_ORDER.indexOf(item(a)?.slot) - SLOT_ORDER.indexOf(item(b)?.slot));
const dayName = d => {
  const y = new Date(Date.now() - 864e5).toLocaleDateString("en-CA");
  return d === todayStr() ? "today" : d === y ? "yesterday" : new Date(d + "T12:00").toLocaleDateString("en-US", {weekday:"long", month:"short", day:"numeric"});
};

// Build a fit from scratch: pick a day, tap pieces across every slot, then name/log it in the wear sheet.
function buildFit(start = {}) {
  const yday = new Date(Date.now() - 864e5).toLocaleDateString("en-CA");
  const st = {date: start.date || todayStr(), sel: [...(start.items || [])], f: "all"};
  openSheet("", sh => {
    const paint = () => {
      const list = items().filter(i => !i.avoid && (st.f === "all" || i.slot === st.f))
        .sort((a, b) => (SLOT_ORDER.indexOf(a.slot) - SLOT_ORDER.indexOf(b.slot)) || (isDirty(a.code) - isDirty(b.code)));
      const custom = st.date !== todayStr() && st.date !== yday;
      sh.innerHTML = `<div class="grab"></div><h2>Build a fit</h2><p class="lead">Tap everything you wore. Tap again to drop it.</p>
        <div class="days" role="group" aria-label="Day">
          <button class="chip" aria-pressed="${st.date === todayStr()}" data-b="day" data-d="${todayStr()}">Today</button>
          <button class="chip" aria-pressed="${st.date === yday}" data-b="day" data-d="${yday}">Yesterday</button>
          <input type="date" id="b-date" max="${todayStr()}" value="${custom ? st.date : ""}" aria-label="Other day"></div>
        <div class="picked">${st.sel.length ? bySlot(st.sel).map(c => `<button data-b="unpick" data-code="${c}" aria-label="Remove ${esc(item(c)?.name || c)}">${img(item(c)?.photo, "")}</button>`).join("")
          : `<span class="hint">Nothing picked yet.</span>`}</div>
        <div class="filters">${[["all", "All"], ...SLOTS].map(([k, l]) => `<button class="chip" aria-pressed="${st.f === k}" data-b="f" data-k="${k}">${l}</button>`).join("")}</div>
        <div class="picker">${list.map(i => `<button data-b="pick" data-code="${i.code}" aria-pressed="${st.sel.includes(i.code)}" class="${st.sel.includes(i.code) ? "sel" : ""} ${isDirty(i.code) ? "dirty" : ""}">${img(i.photo, "")}<span>${esc(i.name)}${isDirty(i.code) ? " · hamper" : ""}</span></button>`).join("")}</div>
        <div class="sheet-actions"><button class="btn ghost" data-b="cancel">Cancel</button>
          <button class="btn primary" data-b="next" ${st.sel.length ? "" : "disabled"}>Next${st.sel.length ? ` · ${st.sel.length}` : ""}</button></div>`;
    };
    const keepScroll = fn => { const y = sh.scrollTop, px = $(".picked", sh)?.scrollLeft || 0; fn(); paint(); sh.scrollTop = y; const pk = $(".picked", sh); if (pk) pk.scrollLeft = px; };
    paint();
    sh.onchange = e => { if (e.target.id === "b-date" && e.target.value) { st.date = e.target.value > todayStr() ? todayStr() : e.target.value; keepScroll(() => {}); } };
    sh.onclick = e => {
      const b = e.target.closest("[data-b]"); if (!b) return;
      const a = b.dataset.b, c = b.dataset.code;
      if (a === "cancel") return closeSheet();
      if (a === "day") return keepScroll(() => st.date = b.dataset.d);
      if (a === "f") return keepScroll(() => st.f = b.dataset.k);
      if (a === "pick") return keepScroll(() => st.sel.includes(c) ? st.sel.splice(st.sel.indexOf(c), 1) : st.sel.push(c));
      if (a === "unpick") return keepScroll(() => st.sel.splice(st.sel.indexOf(c), 1));
      if (a === "next") { sh.onclick = sh.onchange = null; wearSheet({date: st.date, name: "", when: "", items: bySlot(st.sel)}); }
    };
  });
}

function pickItem(sh, slot, current, done) {
  let f = slot || "all";
  const paint = () => {
    const list = items().filter(i => !i.avoid && i.code !== current && (f === "all" || i.slot === f))
      .sort((a, b) => isDirty(a.code) - isDirty(b.code));
    sh.innerHTML = `<div class="grab"></div><h2>${current ? "Swap for…" : "Add a piece"}</h2>
      <div class="filters">${[["all", "All"], ...SLOTS].map(([k, l]) => `<button class="chip" aria-pressed="${f === k}" data-pf="${k}">${l}</button>`).join("")}</div>
      <div class="picker">${list.map(i => `<button data-pick="${i.code}" class="${isDirty(i.code) ? "dirty" : ""}">${img(i.photo, "")}<span>${esc(i.name)}${isDirty(i.code) ? " · hamper" : ""}</span></button>`).join("")}</div>
      <div class="sheet-actions"><button class="btn ghost" data-pb>Back</button></div>`;
  };
  paint();
  sh.onclick = e => {
    const p = e.target.closest("[data-pick]"), pf = e.target.closest("[data-pf]");
    if (pf) { f = pf.dataset.pf; return paint(); }
    if (p || e.target.closest("[data-pb]")) { sh.onclick = sh.onchange = null; done(p ? p.dataset.pick : null); sh.scrollTop = 0; }
  };
  sh.onchange = null; sh.scrollTop = 0;
}

function itemSheet(code) {
  const it = item(code), worn = (S.log?.worn || []).filter(x => x.items.includes(code));
  const lim = (S.laundry?.wash_after || {})[it.type] || 0, w = wearsSinceWash(code);
  openSheet(`<div style="display:flex;gap:14px">${img(it.photo, it.name)}<div><h2>${esc(it.name)}</h2>
      <p class="lead">${esc(it.colour)} · ${esc(TYPE_LABEL[it.type] || it.type)} · tag ${esc(code)}</p>
      <p class="lead">Worn ${worn.length} time${worn.length === 1 ? "" : "s"}${worn[0] ? `, last ${new Date(worn[0].date + "T12:00").toLocaleDateString("en-US", {month:"short", day:"numeric"})}` : ""}.</p>
      ${lim ? `<p class="lead">${isDirty(code) ? `In the hamper after ${w} wear${w === 1 ? "" : "s"}.` : `${w} of ${lim} wears before the hamper.`}</p>` : ""}</div></div>
    <div class="sheet-actions">${lim && w ? `<button class="btn" data-i="wash">Mark washed</button>` : ""}
      <button class="btn ${it.avoid ? "primary" : "ghost"}" data-i="avoid">${it.avoid ? "Put back in rotation" : "Hide from fits"}</button></div>`,
    sh => {
      sh.querySelector("img").style.cssText = "width:110px;height:138px;object-fit:cover;border-radius:8px;flex:0 0 auto";
      sh.onclick = e => {
        const b = e.target.closest("[data-i]"); if (!b) return;
        if (b.dataset.i === "wash") { run("washItem", {code, at: nowIso()}); toast(`${it.name} washed`); }
        if (b.dataset.i === "avoid") { run("setItem", {code, patch:{avoid: !it.avoid}}); toast(it.avoid ? "Hidden from fits" : "Back in rotation"); }
        closeSheet();
      };
    });
}

function addItemSheet() {
  const st = {blob:null, url:""};
  const paint = sh => {
    const keep = ["a-name", "a-colour", "a-type"].map(id => $("#" + id, sh)?.value);
    sh.innerHTML = `<div class="grab"></div><h2>Add a piece</h2><p class="lead">Lay it flat on the carpet and shoot straight down, like the rest of the closet.</p>
      <div class="photo-pick">${st.url ? `<img src="${esc(st.url)}" alt="">` : ""}<label class="btn small">${st.url ? "Retake" : "Take or choose photo"}<input type="file" accept="image/*" id="a-photo" class="sr"></label></div>
      <label class="f">Name<input id="a-name" placeholder="e.g. Waffle henley"></label>
      <label class="f">Colour<input id="a-colour" placeholder="e.g. oatmeal"></label>
      <label class="f">Type<select id="a-type">${Object.entries(TYPE_LABEL).map(([k, l]) => `<option value="${k}">${l}</option>`).join("")}</select></label>
      <p id="a-err" class="err" hidden></p>
      <div class="sheet-actions"><button class="btn ghost" data-a="cancel">Cancel</button><button class="btn primary" data-a="save">Add to closet</button></div>`;
    ["a-name", "a-colour", "a-type"].forEach((id, i) => { if (keep[i] != null) $("#" + id, sh).value = keep[i]; });
  };
  openSheet("", sh => {
    paint(sh);
    sh.onchange = async e => { if (e.target.id === "a-photo" && e.target.files[0]) { st.blob = await compress(e.target.files[0], 900); st.url = URL.createObjectURL(st.blob); paint(sh); } };
    sh.onclick = async e => {
      const b = e.target.closest("[data-a]"); if (!b) return;
      if (b.dataset.a === "cancel") return closeSheet();
      const name = $("#a-name", sh).value.trim(), colour = $("#a-colour", sh).value.trim(), type = $("#a-type", sh).value;
      const err = $("#a-err", sh);
      if (!st.blob || !name || !colour) { err.hidden = false; err.textContent = "Add a photo, a name and a colour."; return; }
      const id = Math.random().toString(36).slice(2, 8), path = `photos/items/${todayStr()}_${id}.jpg`;
      imgCache.set(path, st.url);
      run("addItem", {item:{code:null, name, colour, type, slot: TYPES[type], avoid:false, uncalibrated:false, photo: path, added: todayStr()},
        upload:{path, b64: await blobToB64(st.blob)}});
      closeSheet(); toast(`${name} added. It can show up in tomorrow's fits.`);
    };
  });
}

function tweak(f, plan) {
  const list = f.items.map(c => `${item(c)?.name} (${item(c)?.colour}, ${c})`).join(", ");
  const text = `Tweak today's fit from my Rail morning sheet. ${plan.subtitle}\nFit ${f.n} "${f.name}" (${f.when}): ${list}.\nUse only my Provo closet (claude/fit-sheet + the-rail-data). Change it so: `;
  try { navigator.clipboard.writeText(text); } catch {}
  window.open(`https://claude.ai/new?q=${encodeURIComponent(text)}`, "_blank", "noopener");
}

/* ---------------- events ---------------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab]");
  if (t) {
    if (tab === t.dataset.tab) return;
    tab = t.dataset.tab; render(); scrollTo(0, 0);
    if (window.SX) SX.enter("#view", null, "up");     // the new tab settles in; sync redraws stay still
    return;
  }
  const fl = e.target.closest("[data-filter]");
  if (fl) {                                          // pieces glide into their filtered spots
    closetFilter = fl.dataset.filter;
    window.SX ? SX.flip("#view", ".grid .piece", render) : render();
    return;
  }
  const a = e.target.closest("#view [data-act]"); if (!a) return;
  const plan = todayPlan(), act = a.dataset.act;
  if (act === "wear") { const f = plan.fits.find(x => x.n === +a.dataset.n); return wearSheet({date: plan.date, name: f.name, when: f.when, items: f.items, n: f.n}); }
  if (act === "tweak") return tweak(plan.fits.find(x => x.n === +a.dataset.n), plan);
  if (act === "log-own") return buildFit();
  if (act === "laundry") {
    if (a.dataset.armed) { run("laundry", {at: nowIso()}); if (window.SX) SX.bump(".hamper"); return toast("Hamper emptied"); }
    a.dataset.armed = 1; a.textContent = "Tap again to empty"; a.classList.add("warn");
    setTimeout(() => { if (a.isConnected) { delete a.dataset.armed; a.textContent = "Did laundry"; a.classList.remove("warn"); } }, 3000); return;
  }
  if (act === "item") return itemSheet(a.dataset.code);
  if (act === "add-item") return addItemSheet();
  if (act === "resync") { await flush(); if (!queue.length) { await pull().catch(() => {}); render(); toast("Synced"); } return; }
  if (act === "save-cfg") {
    Object.assign(cfg, {owner: $("#s-owner").value.trim(), repo: $("#s-repo").value.trim(), token: $("#s-token").value.trim()});
    const msg = $("#cfg-msg"); a.disabled = true; a.textContent = "Connecting…";
    try {
      await GH.getJson("wardrobe.json").then(r => { if (!r.data) throw new GhError(404, "wardrobe.json isn't in that repo yet"); });
      ls("rail.cfg", cfg); await pull(); online = true; tab = "today"; render(); toast("Connected"); flush();
    } catch (err) {
      msg.hidden = false; a.disabled = false; a.textContent = "Save and connect";
      msg.textContent = err.status === 401 ? "GitHub rejected that token. Paste it again, or make a new one."
        : err.status === 404 ? `Can't find ${cfg.owner}/${cfg.repo} with this token. Check the name and that the token includes that repo.`
        : err.status === 0 ? "No connection. Try again when you're online." : err.message;
    }
  }
});
window.addEventListener("online", () => { online = true; flush(); });
window.addEventListener("offline", () => { online = false; setSync(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && configured()) { if (queue.length) flush(); else pull().then(render).catch(() => {}); } });

/* ---------------- boot ---------------- */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
render();
if (configured()) (queue.length ? flush() : pull().then(() => { online = true; render(); })).catch(e => { online = e.status !== 0; render(); });
</script>
<!-- ===== New-version bar (same idea as Kitchen, Grocery, Protocol) =====
     Shortly after load, whenever you come back to the app, and every 10 min while it's open,
     the page fetches the live index.html (skipping every cache) and reads its VERSION.
     If the live one is NEWER than the one running, one bar slides down with a Reload button.
     Only ever one bar: a single fixed element, one check in flight at a time, newer-only
     (so a stale CDN copy can't trigger it), and Not now hides that version for this session. -->
<div class="updbar" id="updbar" hidden role="status">
  <div class="updin"><span class="upddot" aria-hidden="true"></span><span class="updtxt" id="updtxt">New version ready</span>
    <button class="updgo" id="updgo" type="button">Reload</button>
    <button class="updx" id="updx" type="button" aria-label="Not now"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
</div>
<style>
  .updbar{position:fixed;left:0;right:0;top:0;z-index:200;padding:calc(10px + var(--safe-t)) 16px 0;pointer-events:none}
  .updbar[hidden]{display:none}
  .updin{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px;height:50px;padding:0 6px 0 16px;box-sizing:border-box;
    border-radius:25px;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18);pointer-events:auto;
    transform:translateY(calc(-100% - 40px));transition:transform .4s cubic-bezier(.2,.8,.2,1), scale .2s cubic-bezier(.3,1.35,.5,1)}
  .updbar.up .updin{transform:none}
  .upddot{width:8px;height:8px;border-radius:4px;background:var(--sage);flex:0 0 auto;box-shadow:0 0 0 4px color-mix(in srgb,var(--sage) 22%,transparent)}
  .updtxt{flex:1;min-width:0;font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .updgo{height:38px;padding:0 18px;border:0;border-radius:19px;background:var(--sage);color:var(--sage-ink);font:inherit;font-size:14px;font-weight:800;cursor:pointer}
  .updgo:active{scale:.96}
  .updgo:disabled{opacity:.6}
  .updx{width:38px;height:38px;border:0;border-radius:19px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
  .updx svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
  @media (prefers-reduced-motion: reduce){ .updin{transition:none} }
</style>
<script>
(function(){
  if (window.__railUpd) return; window.__railUpd = true;          // never wire it up twice
  var U = {last:0, busy:false, dismissed:null, shown:null};
  var RE = /const\s+VERSION\s*=\s*"(\d{4}\.\d\d\.\d\d-[a-z]+)"/;
  function newer(a, b){ return a > b; }                          // YYYY.MM.DD-letter sorts as text
  function check(force){
    if (!/^https?:$/.test(location.protocol) || !window.fetch || U.busy) return;
    if (!force && Date.now() - U.last < 5*60e3) return;
    U.busy = true; U.last = Date.now();
    fetch(location.pathname + "?_=" + Date.now(), {cache:"no-store"})
      .then(function(r){ return r.ok ? r.text() : null; })
      .then(function(html){
        var m = html && html.match(RE);
        if (!m || !newer(m[1], VERSION) || m[1] === U.dismissed || m[1] === U.shown) return;
        show(m[1]);
      }).catch(function(){}).then(function(){ U.busy = false; });
  }
  function show(ver){
    U.shown = ver;
    document.getElementById("updtxt").textContent = "Rail " + ver + " ready";
    var b = document.getElementById("updbar"); b.hidden = false;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ b.classList.add("up"); }); });
  }
  document.getElementById("updgo").addEventListener("click", function(){
    this.disabled = true;                                          // one tap, one reload
    location.replace(location.pathname + "?v=" + Date.now() + location.hash);
  });
  document.getElementById("updx").addEventListener("click", function(){
    U.dismissed = U.shown; var b = document.getElementById("updbar");
    b.classList.remove("up"); setTimeout(function(){ b.hidden = true; }, 420);
  });
  if (/[?&]v=\d+/.test(location.search)) try { history.replaceState(null, "", location.pathname + location.hash); } catch(e) {}
  setTimeout(function(){ check(true); }, 2500);
  document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") check(false); });
  setInterval(function(){ if (document.visibilityState === "visible") check(false); }, 10*60e3);
})();
</script>
</body>
