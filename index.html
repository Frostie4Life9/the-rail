<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E7E6E2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rail">
<title>The Rail</title>
<link rel="manifest" href="manifest.webmanifest?v=1">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=1">
<link rel="icon" type="image/png" sizes="32x32" href="icons/rail-32.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&family=Anybody:wdth,wght@50..150,500..900&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* THE RAIL · "Studio" (2026.11.24-b). Every piece is a cut-out photo laid on a photo-studio backdrop.
   Today's looks are flat lays whose backdrop takes the outfit's own colour (--fc, set per look from its pieces);
   type is a condensed lookbook face (Anybody), body is Hanken Grotesk, small facts read like a care label (Plex Mono).
   Fraunces + Manrope still load because the shared suite bar uses them. --sage is the old name for "the accent". */
:root{
  --page:#E7E6E2; --floor:#D9D7D1; --surface:#FBFAF7; --raised:#F0EFEB; --tile-bg:var(--raised);
  --line:#D6D4CE; --text:#141414; --muted:#5B5A57; --sage:#141414; --sage-ink:#FFFFFF;
  --pop:#C9442A; --pop-ink:#FFFFFF; --amber:#A8441F; --danger:#A63D40;
  --shadow:0 1px 2px rgba(20,20,20,.05),0 8px 22px rgba(20,20,20,.07);
  --drop:drop-shadow(0 12px 12px rgba(20,20,20,.18)) drop-shadow(0 2px 3px rgba(20,20,20,.16));
  --r-sheet:28px; --fc:#8A8780; --fcmix:70%;
  --display:"Anybody","Arial Narrow",system-ui,sans-serif; --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --page:#161615; --floor:#1F1F1D; --surface:#232321; --raised:#2B2A28;
  --line:#3A3936; --text:#F1F0EC; --muted:#A8A6A0; --sage:#F1F0EC; --sage-ink:#141414;
  --pop:#F07052; --pop-ink:#1A0E0A; --amber:#F0956F; --danger:#E6735F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.3);
  --drop:drop-shadow(0 12px 14px rgba(0,0,0,.5)) drop-shadow(0 2px 3px rgba(0,0,0,.4));
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page);color:var(--text)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100dvh;padding-bottom:calc(104px + var(--safe-b))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--text);outline-offset:3px;border-radius:6px}
img{display:block;max-width:100%}
.wrap{max-width:760px;margin:0 auto;padding:18px var(--sx-gut,16px) 24px}
.k{font:500 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.disp{font-family:var(--display);font-weight:850;font-stretch:58%;text-transform:uppercase;line-height:.84;letter-spacing:-.005em}

/* masthead */
.mast .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mast h1{font-family:var(--display);font-weight:850;font-stretch:58%;text-transform:uppercase;font-size:clamp(60px,17vw,96px);line-height:.82;margin-top:8px;overflow-wrap:anywhere}
.mast .right{display:flex;align-items:center;gap:10px}
.mast .sub{color:var(--muted);margin-top:10px;font-size:15px;max-width:60ch}
.gear{width:40px;height:40px;border-radius:99px;display:grid;place-items:center;background:color-mix(in srgb,var(--surface) 70%,transparent);color:var(--text)}
.gear svg{width:19px;height:19px}
.sync{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.sync.off{color:var(--amber)}
.mast .big{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.mast .big .n{font-family:var(--display);font-weight:850;font-stretch:62%;font-size:clamp(60px,17vw,96px);line-height:.82;color:var(--pop);font-variant-numeric:tabular-nums}
.wx{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.wx span{font:500 10.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:6px 10px;border-radius:99px;background:color-mix(in srgb,var(--surface) 72%,transparent)}

/* hamper strip on Today */
.hamper{margin:14px 0 4px;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 16px;min-height:48px;border-radius:99px;background:var(--surface);box-shadow:var(--shadow);font-size:14.5px}
.hamper .grow{flex:1;color:var(--muted);display:flex;align-items:center;gap:8px}
.hamper .grow b{color:var(--text);font-weight:700}
.hamper .dotp{width:8px;height:8px;border-radius:99px;background:var(--pop);flex:none}
.hamper .dotp.ok{background:#3E8E5E}

/* buttons, chips */
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.btn{border-radius:999px;min-height:44px;padding:0 18px;font-weight:600;font-size:15px;line-height:1.1;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--surface);border:1px solid var(--line);color:var(--text);transition:transform .1s,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--sage);color:var(--sage-ink);border-color:var(--sage)}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:0 14px;font-size:13.5px}
.btn.warn{border-color:var(--amber);color:var(--amber)}
.btn.big{min-height:56px;font-size:16px;flex:1}
.btn.round{width:56px;min-height:56px;padding:0;flex:none}
.btn svg{width:19px;height:19px;flex:none}
.btn[disabled]{opacity:.5;pointer-events:none}
.worn-badge{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:15px}
.filters{display:flex;gap:8px;overflow-x:auto;margin-top:16px;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.chip{min-height:36px;padding:0 14px;border-radius:999px;background:color-mix(in srgb,var(--surface) 75%,transparent);font-size:13.5px;font-weight:600;white-space:nowrap;color:var(--text);display:inline-flex;align-items:center}
.chip[aria-pressed=true]{background:var(--text);color:var(--page)}
.empty{margin-top:22px;padding:24px 20px;border-radius:24px;background:var(--surface);color:var(--muted);box-shadow:var(--shadow)}
.empty h3{color:var(--text);font-family:var(--display);font-weight:800;font-stretch:62%;text-transform:uppercase;font-size:30px;line-height:.95;margin-bottom:8px}
.sect{font-family:var(--display);font-weight:800;font-stretch:64%;text-transform:uppercase;font-size:26px;line-height:1;margin:30px 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sect .k{font-stretch:normal}

/* TODAY: looks carousel. Each look is a studio set tinted by its own outfit. */
.looks{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:16px calc(-1 * var(--sx-gut,16px)) 0;padding:0 var(--sx-gut,16px) 4px;
  scroll-padding-inline:var(--sx-gut,16px);scrollbar-width:none;overscroll-behavior-x:contain}
.looks::-webkit-scrollbar{display:none}
.fit{flex:0 0 calc(100% - 22px);scroll-snap-align:start;position:relative;isolation:isolate;overflow:hidden;border-radius:30px;padding:18px 18px 20px;
  background:color-mix(in oklab,var(--fc) 10%,var(--page));transition:background .5s}
.looks .fit:only-child{flex-basis:100%}
.fit::before{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;z-index:-1;background:color-mix(in oklab,var(--fc) 17%,var(--floor));
  border-radius:50% 50% 0 0 / 34px 34px 0 0}
@media (min-width:700px){.fit{flex-basis:calc(50% - 6px)}}
.fit-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.fit-head h2{font-family:var(--display);font-weight:850;font-stretch:56%;text-transform:uppercase;font-size:clamp(46px,13vw,64px);line-height:.84;letter-spacing:-.005em;
  color:color-mix(in oklab,var(--fc) var(--fcmix),var(--text));overflow-wrap:anywhere}
@media (prefers-color-scheme:dark){.fit-head h2{color:color-mix(in oklab,var(--fc) 30%,var(--text))}}
.fit-head .cnt{text-align:right;flex:none;padding-top:4px}
.fit-head .cnt b{display:block;font-family:var(--display);font-weight:800;font-stretch:70%;font-size:28px;line-height:1}
.fit-head .cnt b i{font-style:normal;opacity:.35}
.when{margin-top:8px}
.lay{position:relative;width:100%;max-width:460px;aspect-ratio:1/1.02;margin:10px auto 0}
.piece.lp{position:absolute;padding:0;transform:rotate(var(--r,0deg));transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.lp img{width:100%;height:auto;filter:var(--drop)}
.lp img.raw{aspect-ratio:4/5;object-fit:cover;border-radius:12px}
.lp:active{transform:rotate(var(--r,0deg)) scale(.97)}
.lp.dirty img{opacity:.5}
.lp .tg{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%) rotate(calc(-1 * var(--r,0deg)));font:500 9px var(--mono);letter-spacing:.08em;
  background:var(--text);color:var(--page);border-radius:5px;padding:3px 6px;white-space:nowrap}
@keyframes rail-bob{0%,100%{translate:0 0}50%{translate:0 -4px}}
.lay.bob .lp.on img{animation:rail-bob 4.6s ease-in-out var(--d,0s) infinite}
@media (prefers-reduced-motion:reduce){.lay.bob .lp img{animation:none}}
.legend{font-size:12.5px;line-height:1.45;color:var(--muted);margin-top:8px;text-align:center}
/* the styling note, printed on a hang tag */
.swing{position:relative;margin:14px 2px 0;padding:14px 16px 14px 40px;background:var(--surface);border-radius:8px 14px 14px 8px;box-shadow:var(--shadow);
  clip-path:polygon(16px 0,100% 0,100% 100%,16px 100%,0 calc(100% - 14px),0 14px)}
.swing::before{content:"";position:absolute;left:14px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:99px;background:color-mix(in oklab,var(--fc) 10%,var(--page));box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.swing .k{margin-bottom:4px}
.swing p{font-size:14px;line-height:1.42;color:var(--text)}
.fit .actions{margin-top:14px;flex-wrap:nowrap}
.fit .btn.round{background:color-mix(in srgb,var(--surface) 80%,transparent);border:0}
.dots{display:flex;justify-content:center;gap:6px;margin-top:14px}
.dots button{width:8px;height:8px;border-radius:99px;background:color-mix(in srgb,var(--text) 22%,transparent);transition:width .3s,background .3s;padding:0}
.dots button[aria-current=true]{width:26px;background:var(--text)}
.more{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:22px}

/* tiles (Closet, Diary, sheets): the cut-out on a soft swatch of its own colour */
.piece{position:relative}
.tile{min-width:0}
.tile .ph{position:relative;aspect-ratio:1/1.05;border-radius:18px;background:color-mix(in oklab,var(--fc) 14%,var(--raised));display:grid;place-items:center;overflow:hidden}
.tile .ph img{width:80%;height:80%;object-fit:contain;filter:var(--drop);transition:transform .3s}
.tile .ph img.raw{width:100%;height:100%;object-fit:cover;filter:none}
.tile:hover .ph img{transform:translateY(-3px)}
.tile .nm{font-size:12.5px;line-height:1.2;margin-top:7px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .cl{font:500 9.5px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.tile.dirty .ph img{opacity:.45}
.tile.dirty .cl{color:var(--amber)}
.tile .hp{position:absolute;left:8px;bottom:8px;font:500 9px var(--mono);letter-spacing:.08em;background:var(--text);color:var(--page);border-radius:5px;padding:3px 6px}
.tile.hidden-item .ph img{filter:grayscale(1);opacity:.4}
.piece .qty{position:absolute;top:8px;right:8px;z-index:2;min-width:26px;padding:3px 8px;border-radius:999px;background:var(--surface);color:var(--text);
  font:500 11px/1.2 var(--mono);text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.piece .qty.low{background:var(--pop);color:var(--pop-ink)}
.lp .qty{top:-6px;right:-10px}
.piece button.hit{position:absolute;inset:0;z-index:3}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:16px 10px;margin-top:18px}
.rail{display:flex;gap:10px;overflow-x:auto;margin:0 calc(-1 * var(--sx-gut,16px));padding:4px var(--sx-gut,16px) 8px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .piece{flex:0 0 100px}
.stepper{display:flex;align-items:center;gap:12px;margin-top:10px}
.stepper b{min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}

/* closet colour bar */
.cbar{display:flex;height:16px;border-radius:99px;overflow:hidden;gap:2px;margin-top:16px}
.cbar button{min-width:6px;padding:0;transition:opacity .2s}
.cbar.sel button:not([aria-pressed=true]){opacity:.3}
.cbar-k{display:flex;justify-content:space-between;margin-top:6px;gap:10px}
.fab{position:fixed;right:calc(var(--sx-gut,16px) + 4px);bottom:calc(98px + var(--safe-b));z-index:19;width:60px;height:60px;border-radius:99px;background:var(--pop);color:var(--pop-ink);
  display:grid;place-items:center;box-shadow:0 12px 26px color-mix(in srgb,var(--pop) 45%,transparent)}
.fab svg{width:24px;height:24px}

/* hamper */
.pile{position:relative;height:250px;margin:6px calc(-1 * var(--sx-gut,16px)) 0}
.pile img{position:absolute;filter:var(--drop)}
.pile .none{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:15px}
.alert{margin-top:6px;padding:16px;border-radius:20px;background:var(--text);color:var(--page);display:flex;gap:12px;align-items:flex-start}
.alert svg{width:22px;height:22px;flex:none;color:#F3B06B;margin-top:1px}
.alert b{display:block;font-size:15px}
.alert span{font-size:13.5px;line-height:1.4;opacity:.8}
.loads{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.load{background:var(--surface);border-radius:20px;padding:14px 14px 14px 16px;box-shadow:var(--shadow)}
.load .top{display:flex;align-items:center;gap:12px}
.load .sw{width:30px;height:30px;border-radius:9px;flex:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--text) 14%,transparent)}
.load .t{flex:1;min-width:0}
.load .t b{display:block;font-size:15px}
.load p{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.4}
.foot{text-align:center;margin-top:12px}

/* diary */
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:40px;height:40px;border-radius:99px;background:color-mix(in srgb,var(--surface) 70%,transparent);display:grid;place-items:center}
.cal-nav button[disabled]{opacity:.35;pointer-events:none}
.cal-nav svg{width:18px;height:18px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:16px}
.cal .wd{text-align:center;font:500 10px var(--mono);color:var(--muted);padding-bottom:2px}
.cal .d{position:relative;aspect-ratio:1/1.04;border-radius:12px;background:color-mix(in srgb,var(--surface) 45%,transparent);display:grid;place-items:center;overflow:hidden;padding:0}
.cal .d.has{background:color-mix(in oklab,var(--fc) 16%,var(--raised))}
.cal .d img{width:74%;height:74%;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.2))}
.cal .d i{position:absolute;left:5px;top:3px;font:500 9px var(--mono);font-style:normal;color:var(--muted)}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--text)}
.cal .d.fut{background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--text) 12%,transparent)}
.cal .d.pad{visibility:hidden}
.repeat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.repeat .cl{text-align:center}
.nudge{margin-top:18px;width:100%;text-align:left;padding:12px 14px;border-radius:20px;background:var(--surface);display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.nudge .ph{width:56px;height:56px;border-radius:14px;flex:none;display:grid;place-items:center;background:color-mix(in oklab,var(--fc) 14%,var(--raised))}
.nudge .ph img{width:44px;height:44px;object-fit:contain}
.nudge b{display:block;font-size:14.5px;line-height:1.3}
.nudge span{font-size:13px;color:var(--muted)}
.nudge svg{width:18px;height:18px;flex:none;margin-left:auto}
.entry{padding:16px 0;border-bottom:1px solid var(--line);scroll-margin-top:90px}
.entry .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.entry h3{font-size:16px;font-weight:700}
.entry .d{white-space:nowrap}
.entry .strip{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.entry .strip .sw{width:60px;height:66px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;background:color-mix(in oklab,var(--fc) 14%,var(--raised))}
.entry .strip .sw img{width:80%;height:80%;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.18))}
.entry .strip .selfie{width:66px;height:88px;object-fit:cover;border-radius:12px;margin-right:4px}
.entry .fb{font-size:14px;margin-top:8px}
.entry .fb.b{color:var(--amber)}
.mini-list{margin-top:8px;color:var(--muted);font-size:14px;line-height:1.5}

/* tab bar: a floating pill */
nav.tabs{position:fixed;left:0;right:0;bottom:calc(14px + var(--safe-b));z-index:20;display:flex;justify-content:center;padding:0 var(--sx-gut,16px);pointer-events:none}
nav.tabs .in{display:flex;max-width:440px;width:100%;height:64px;border-radius:99px;background:#141414;padding:0 8px;pointer-events:auto;
  box-shadow:0 14px 34px rgba(0,0,0,.28)}
@media (prefers-color-scheme:dark){nav.tabs .in{background:#2E2D2B;box-shadow:0 14px 34px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.06)}}
nav.tabs button{flex:1;position:relative;font-size:10.5px;font-weight:600;color:rgba(255,255,255,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:color .2s}
nav.tabs button[aria-current=page]{color:#fff}
nav.tabs svg{width:22px;height:22px}
nav.tabs .bdg{position:absolute;top:7px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--pop);color:var(--pop-ink);font:700 10px/18px var(--body)}
nav.tabs .bdg:empty{display:none}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(10,10,10,.42);z-index:80;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;max-height:92dvh;overflow:auto;background:var(--surface);
  border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:10px 20px calc(20px + var(--safe-b));box-shadow:0 -14px 44px -18px rgba(0,0,0,.45);
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:760px;margin:0 auto;overscroll-behavior:contain}
.sheet.on{transform:none}
.sheet .fit{flex:none;margin-top:16px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px;touch-action:none}
.sheet h2{font-family:var(--display);font-weight:850;font-stretch:60%;text-transform:uppercase;font-size:40px;line-height:.9}
.sheet .lead{color:var(--muted);font-size:14px;margin-top:6px}
.sheet .filters .chip:not([aria-pressed=true]){background:var(--raised)}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.rows{margin-top:14px}
.prow{display:flex;align-items:center;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
.prow:last-child{border-bottom:1px solid var(--line)}
.prow .th{width:58px;height:58px;border-radius:14px;flex:none;display:grid;place-items:center;background:color-mix(in oklab,var(--fc) 14%,var(--raised))}
.prow .th img{width:46px;height:46px;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.18))}

<style id="suite-css">
/* App colors come from each app's home-screen icon, so the bar, the icon and
   the page all agree. The tab for every app carries its own color, so the
   whole set reads as one color-coded system wherever you are in it. */
.sx-bar{

  --sx-on:#FFF8EF;

  --sx-on:#15120E;

  --sx-on:#15120E;

/* Moving between apps: they all live on frostie4life9.github.io, so the
   browser can cross-fade one page into the next instead of cutting. The bar
   is its own layer, so it holds still and just changes color and name,
   while the page underneath settles in. Safari 18.2+ and Chrome; anything
   older just navigates as before. */
@view-transition{navigation:auto}
.sx-bar{view-transition-name:sx-bar}
::view-transition-group(sx-bar){animation-duration:.4s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}

<script>
(function(){ /* suite: Ideas, a small wish list for this app. Saved on this device, synced to the ideas Worker so Claude can read it */
  var bar=document.querySelector('.sx-bar'), btn=document.getElementById('sx-ibtn'), pan=document.getElementById('sx-ideas');
  if(!bar||!btn||!pan) return;
  var APP=bar.getAttribute('data-app')||'', KEY='suite_ideas_v2_'+APP, URLKEY='suite_ideas_url', DAY=86400000,
      WORKER='https://ideas-sync.skyfro04.workers.dev', TOKEN='omakJuBdO4ZE2rXXPBuWuxRRnt920iqn', mem=[];
  var NAMES={kitchen:'Kitchen',grocery:'Grocery',lift:'Lift',dishlog:'DishLog',protocol:'Protocol',rail:'Rail',gamelog:'Game Log',playback:'Playback'};
  var LABEL=NAMES[APP]||'this app';
  var VARS=['--sx-kitchen','--sx-grocery','--sx-lift','--sx-dishlog','--sx-protocol','--sx-rail','--sx-gamelog','--sx-playback',
            '--sx-on','--sx-paper','--sx-ink','--sx-dim','--sx-line','--sx-hover'];
  var form=pan.querySelector('#sx-iform'), input=pan.querySelector('#sx-iin'), list=pan.querySelector('#sx-ilist'),
      copyB=pan.querySelector('#sx-icopy'), clrB=pan.querySelector('#sx-iclr'), stat=pan.querySelector('#sx-ist');
  input.placeholder='Add an idea for '+LABEL;

  /* On narrower windows the tabs and this button don't both fit. Measure the real thing (fonts included) and, only if they
     would touch, let every tab but the current one show just its icon. */
  function fit(){
    bar.classList.remove('sx-compact');
    var tabs=bar.querySelector('.sx-tabs'); if(!tabs || getComputedStyle(tabs).display==='none' || !tabs.lastElementChild) return;
    if(tabs.lastElementChild.getBoundingClientRect().right > btn.getBoundingClientRect().left - 10) bar.classList.add('sx-compact');
  }
  fit(); window.addEventListener('resize',fit);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  /* ---- storage: every idea is {id,text,done,deleted,t (made),u (last changed)}. A deleted idea stays as a small marker for
     30 days so another device can't bring it back. ---- */
  function good(x){ return x && typeof x.id==='string' && typeof x.text==='string'; }
  function load(){
    var a; try{ var r=localStorage.getItem(KEY); a=r?JSON.parse(r):[]; }catch(e){ a=mem; }
    return Array.isArray(a)?a.filter(good):[];
  }
  function put(a){ mem=a; try{ localStorage.setItem(KEY,JSON.stringify(a)); }catch(e){} }
  function live(a){ return a.filter(function(x){ return !x.deleted; }); }
  function merge(a,b){   /* same idea on two sides: the one changed last wins */
    var m={}; a.concat(b).forEach(function(x){ if(!good(x)) return; var o=m[x.id]; if(!o || (x.u||0)>(o.u||0)) m[x.id]=x; });
    var cut=Date.now()-30*DAY;
    return Object.keys(m).map(function(k){ return m[k]; }).filter(function(x){ return !(x.deleted && (x.u||0)<cut); });
  }
  function plain(){
    var rows=live(load()).filter(function(x){ return !x.done; }).sort(function(a,b){ return (a.t||0)-(b.t||0); });
    if(!rows.length) return '';
    return ['## '+LABEL].concat(rows.map(function(x){ return '- '+x.text; })).join(String.fromCharCode(10));
  }

  /* ---- sync: saved here first, then sent in the background. Failing is fine; it tries again on the next change. ---- */
  var busy=false, again=false, timer=null;
  function say(s){ stat.textContent=s; }
  function endpoint(){ var u=''; try{ u=localStorage.getItem(URLKEY)||''; }catch(e){} return (u||WORKER).replace(/\/+$/,''); }
  function schedule(ms){ clearTimeout(timer); timer=setTimeout(sync, ms==null?600:ms); }
  function sync(){
    if(!window.fetch) return;
    if(navigator.onLine===false){ say('Offline · saved here'); return; }
    if(busy){ again=true; return; }
    busy=true; again=false; say('Syncing…');
    fetch(endpoint()+'/sync/'+APP,{method:'POST',headers:{'content-type':'application/json','x-ideas-key':TOKEN},body:JSON.stringify({items:load()})})
      .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
      .then(function(j){ put(merge(load(), j.items||[])); say('Synced'); if(!pan.hidden) render(); })
      .catch(function(){ say('Not synced yet'); })
      .then(function(){ busy=false; if(again) schedule(300); });
  }
  schedule(1500);
  window.addEventListener('online',function(){ schedule(300); });
  document.addEventListener('visibilitychange',function(){ if(!document.hidden && !pan.hidden) schedule(300); });

  /* ---- panel ---- */
  function mk(tag,cls,txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
  var SVG_CK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var SVG_X='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  function render(){
    var pool=live(load()).sort(function(a,b){ return (a.done?1:0)-(b.done?1:0) || (b.t||0)-(a.t||0); });
    list.textContent='';
    if(!pool.length) list.appendChild(mk('li','sx-iempty','Nothing yet. Jot down anything you wish '+LABEL+' did.'));
    pool.forEach(function(x){
      var li=mk('li','sx-ii'+(x.done?' sx-done':'')); li.setAttribute('data-id',x.id);
      var ck=mk('button','sx-ick'); ck.type='button'; ck.setAttribute('role','checkbox'); ck.setAttribute('aria-checked',x.done?'true':'false');
      ck.setAttribute('aria-label',(x.done?'Mark not done: ':'Mark done: ')+x.text); ck.innerHTML=SVG_CK;
      li.appendChild(ck); li.appendChild(mk('span','sx-itx',x.text));
      var dl=mk('button','sx-idel'); dl.type='button'; dl.setAttribute('aria-label','Delete idea: '+x.text); dl.innerHTML=SVG_X;
      li.appendChild(dl); list.appendChild(li);
    });
    copyB.disabled=!plain();
    clrB.disabled=!pool.some(function(x){ return x.done; });
  }
  function paint(){ /* the panel lives on <body>, so hand it the bar's current colors */
    var cs=getComputedStyle(bar);
    VARS.forEach(function(v){ pan.style.setProperty(v,cs.getPropertyValue(v)); });
    pan.style.setProperty('--sx-ac',cs.getPropertyValue('--app'));
  }
  function set(o){
    btn.setAttribute('aria-expanded',o?'true':'false');
    if(!o){ pan.hidden=true; return; }
    var g=document.getElementById('sx-gbtn'); if(g && g.getAttribute('aria-expanded')==='true') g.click();
    if(pan.parentNode!==document.body) document.body.appendChild(pan);
    paint(); pan.hidden=false; render(); input.focus({preventScroll:true}); schedule(0);
  }

  btn.addEventListener('click',function(e){ e.stopPropagation(); set(pan.hidden); });
  pan.addEventListener('click',function(e){ if(e.target===pan) set(false); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && !pan.hidden){ set(false); btn.focus(); } });
  window.addEventListener('pageshow',function(e){ if(e.persisted){ pan.hidden=true; btn.setAttribute('aria-expanded','false'); } });  /* only when the page comes back from the back/forward cache */
  window.addEventListener('storage',function(e){ if(e.key===KEY && !pan.hidden) render(); });

  form.addEventListener('submit',function(e){
    e.preventDefault();
    var v=input.value.replace(/\s+/g,' ').trim(); if(!v){ input.value=''; return; }
    var n=Date.now(), a=load(); a.push({id:n.toString(36)+Math.random().toString(36).slice(2,6), text:v.slice(0,280), done:0, deleted:0, t:n, u:n});
    put(a); input.value=''; render(); schedule(); input.focus({preventScroll:true});
  });
  list.addEventListener('click',function(e){
    var li=e.target.closest('.sx-ii'); if(!li) return;
    var id=li.getAttribute('data-id'), a=load(), n=Date.now();
    if(e.target.closest('.sx-ick')){ a.forEach(function(x){ if(x.id===id){ x.done=x.done?0:1; x.u=n; } }); }
    else if(e.target.closest('.sx-idel')){ a.forEach(function(x){ if(x.id===id){ x.deleted=1; x.text=''; x.u=n; } }); }
    else return;
    put(a); render(); schedule();
  });
  clrB.addEventListener('click',function(){
    var n=Date.now(), a=load(); a.forEach(function(x){ if(x.done && !x.deleted){ x.deleted=1; x.text=''; x.u=n; } });
    put(a); render(); schedule();
  });
  copyB.addEventListener('click',function(){
    var t=plain(); if(!t) return;
    function ok(){ copyB.textContent='Copied'; setTimeout(function(){ copyB.textContent='Copy list'; },1400); }
    function fallback(){
      var ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); ok(); }catch(err){ copyB.textContent='Copy failed'; }
      document.body.removeChild(ta);
    }
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok,fallback); else fallback();
  });
})();
</script>

<script>
"use strict";
const VERSION = "2026.11.24-d";   // date-based: YYYY.MM.DD-letter (a, b, c… for same-day releases). Keep sw.js in step.
const SLOTS = [["layer","Layers"],["top","Tops"],["bottom","Bottoms"],["shoes","Shoes"],["socks","Socks"],["cap","Caps"]];

  trousers:"bottom",joggers:"bottom",shorts:"bottom",shoes:"shoes",socks:"socks",cap:"cap"};

/* ---------------- config ---------------- */
const cfg = Object.assign({owner:"Frostie4Life9", repo:"the-rail-data", branch:"main", token:"", mode:"github", session:"", me:null}, ls("rail.cfg") || {});
// Two ways to reach your data: "account" (Google sign-in, through the rail-api Worker; how friends use it) or
// "github" (the owner's original path: a fine-grained token on this device, straight to the private data repo).
const RAIL_API = "https://rail-api.skyfro04.workers.dev";
const GCID = "961476018828-tkjmdic1fnrtr7jtfmb7ta9alrupn8km.apps.googleusercontent.com";   // must match GOOGLE_CLIENT_ID in wrangler.jsonc

/* ---------------- GitHub contents API ---------------- */
class GhError extends Error { constructor(status, msg) { super(msg); this.status = status; } }
const GH = {
  url(path) { return `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${path.split("/").map(encodeURIComponent).join("/")}`; },
  headers(raw) { return {Authorization:`Bearer ${cfg.token}`, Accept: raw ? "application/vnd.github.raw+json" : "application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28"}; },
  async req(path, opts = {}, raw = false) {

  },
  async getJson(path) {
    try {
      const j = await (await this.req(path)).json();
      const bytes = Uint8Array.from(atob(j.content.replace(/\n/g, "")), c => c.charCodeAt(0));
      return {data: JSON.parse(new TextDecoder().decode(bytes)), sha: j.sha};

  },
  async getBlob(path) { return (await this.req(path, {}, true)).blob(); },
  async put(path, b64, sha, message) {

/* The rail-api Worker speaks the same shape as the GitHub contents API above, so sync code doesn't care which it is. */
const API = {
  async req(path, opts = {}) {
    let res;
    try { res = await fetch(RAIL_API + path, {cache:"no-store", ...opts, headers:{...(cfg.session ? {Authorization:`Bearer ${cfg.session}`} : {}), ...(opts.headers || {})}}); }
    catch { throw new GhError(0, "offline"); }

      let m = res.statusText; try { m = (await res.json()).error || m; } catch {}
      if (res.status === 401 && path !== "/auth/google") { cfg.session = ""; ls("rail.cfg", cfg); m = "You're signed out. Sign in again in Settings"; }
      throw new GhError(res.status, m);
    }
    return res;
  },
  file: path => "/files/" + path.split("/").map(encodeURIComponent).join("/"),
  async getJson(path) {
    try {
      const j = await (await this.req(this.file(path))).json();
      const bytes = Uint8Array.from(atob(j.content), c => c.charCodeAt(0));
      return {data: JSON.parse(new TextDecoder().decode(bytes)), sha: j.sha};
    } catch (e) { if (e.status === 404) return {data:null, sha:null}; throw e; }
  },
  async getBlob(path) { return (await this.req(this.file(path))).blob(); },
  async put(path, b64, sha, message) {
    const body = {message, content:b64}; if (sha) body.sha = sha;
    return (await (await this.req(this.file(path), {method:"PUT", body:JSON.stringify(body), headers:{"Content-Type":"application/json"}})).json()).sha;
  },
  async json(path, method = "GET", body) {
    return (await this.req(path, {method, ...(body ? {body:JSON.stringify(body), headers:{"Content-Type":"application/json"}} : {})})).json();
  },
};
const Store = () => isAccount() ? API : GH;
function b64utf8(str) { const b = new TextEncoder().encode(str); let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(s); }

/* ---------------- state ---------------- */
const S = ls("rail.state") || {wardrobe:null, log:null, laundry:null, shas:{}, synced:null};
let queue = ls("rail.queue") || [];
let online = true, syncing = false, tab = "today";
const saveState = () => ls("rail.state", S);
const saveQueue = () => ls("rail.queue", queue);

const DEFAULTS = {
  "wardrobe.json": () => ({next_code:9001, items:[]}),
  "fit-log.json": () => ({planned:[], worn:[]}),
  "laundry.json": () => ({wash_after:{tee:1,collared:2,knit:3,crewneck:3,hoodie:4,outerwear:10,trousers:4,joggers:3,shorts:2,cap:0,shoes:0,socks:1}, last_full:null, washed:{}, dirtied:{}}),
};
const KEY = {"wardrobe.json":"wardrobe","fit-log.json":"log","laundry.json":"laundry"};

async function pull() {
  const got = await Promise.all(FILES.map(f => Store().getJson(f)));
  FILES.forEach((f, i) => { S[KEY[f]] = got[i].data || DEFAULTS[f](); S.shas[f] = got[i].sha; });
  S.synced = nowIso(); saveState();
}

/* Every change is a named, replayable operation. Applied locally at once, then
   pushed: re-read the file, apply again on the fresh copy, write with its sha.
   A conflict just means "someone else wrote first" — re-read and retry. */
const OPS = {
  wore: {file:"fit-log.json", apply(log, p) {
    log.worn = log.worn.filter(x => !(x.date === p.rec.date && x.name === p.rec.name));
    log.worn.push(p.rec); log.worn.sort((a, b) => (b.date + (b.logged_at||"")).localeCompare(a.date + (a.logged_at||"")));
  }},
  unwear: {file:"fit-log.json", apply(log, p) { log.worn = log.worn.filter(x => !(x.date === p.date && x.name === p.name)); }},
  laundry: {file:"laundry.json", apply(l, p) { l.last_full = p.at; l.washed = {}; }},
  washItem: {file:"laundry.json", apply(l, p) { l.washed = l.washed || {}; l.washed[p.code] = p.at; }},
  // Hand-moved into the hamper. Dirty until a later single wash or full laundry (those stamp a newer time).
  hamperItem: {file:"laundry.json", apply(l, p) { l.dirtied = l.dirtied || {}; l.dirtied[p.code] = p.at; }},
  addItem: {file:"wardrobe.json", apply(w, p) {
    const used = new Set(w.items.map(i => i.code));
    let code = Math.max(w.next_code || 9001, ...w.items.map(i => +i.code || 0).filter(n => n >= 9001).map(n => n + 1));
    if (p.item.code && !used.has(p.item.code)) code = +p.item.code;
    while (used.has(String(code))) code++;
    p.item.code = String(code); w.items.push(p.item); w.next_code = code + 1;
  }},
  setItem: {file:"wardrobe.json", apply(w, p) { const it = w.items.find(i => i.code === p.code); if (it) Object.assign(it, p.patch); }},
};

function run(op, payload) {
  const def = OPS[op], key = KEY[def.file];
  S[key] = S[key] || DEFAULTS[def.file]();
  def.apply(S[key], payload); saveState();
  queue.push({op, payload, id: Math.random().toString(36).slice(2)}); saveQueue();
  render(); flush();
}

async function flush() {
  if (syncing || !configured()) return;
  syncing = true; setSync();
  try {
    while (queue.length) {
      const q = queue[0], def = OPS[q.op];
      if (q.payload.upload) {            // photo travels with the op that references it
        const u = q.payload.upload;
        try { await Store().put(u.path, u.b64, null, `Photo ${u.path}`); }
        catch (e) { if (e.status !== 422) throw e; }   // 422 = already uploaded on an earlier try
        delete q.payload.upload; saveQueue();
      }
      for (let attempt = 0; ; attempt++) {
        const fresh = await Store().getJson(def.file);
        const data = fresh.data || DEFAULTS[def.file]();
        def.apply(data, q.payload);
        try {
          S.shas[def.file] = await Store().put(def.file, b64utf8(JSON.stringify(data, null, 1) + "\n"), fresh.sha, `${q.op}: ${summary(q)}`);
          S[KEY[def.file]] = data; break;
        } catch (e) { if ((e.status === 409 || e.status === 422) && attempt < 4) continue; throw e; }
      }
      queue.shift(); saveQueue();
    }
    await pull(); online = true;
  } catch (e) {
    online = e.status !== 0 ? online : false;
    if (e.status === 401 || e.status === 403 || e.status === 404) toast(`Sync stopped: ${e.message}. Check Settings.`);
    if (isAccount() && !cfg.session) tab = "settings";

}
function summary(q) {
  const p = q.payload;
  return {wore:() => `${p.rec.date} ${p.rec.name}`, unwear:() => `${p.date} ${p.name}`, laundry:() => "full laundry",
    washItem:() => p.code, hamperItem:() => p.code, addItem:() => p.item.name, setItem:() => p.code}[q.op]?.() || q.op;
}

/* ---------------- derived ---------------- */
const items = () => (S.wardrobe?.items || []).filter(i => !i.retired);
const item = code => (S.wardrobe?.items || []).find(i => i.code === code);
function washStamp(code) {   // when this piece was last known clean: last full laundry or its own wash
  const l = S.laundry || DEFAULTS["laundry.json"]();
  return [l.last_full, (l.washed || {})[code]].filter(Boolean).sort().pop() || "";
}
function wearsSinceWash(code) {
  const reset = washStamp(code);
  return (S.log?.worn || []).filter(x => x.items.includes(code) && (x.logged_at || x.date + "T12:00:00+00:00") > reset).length;
}
// Put in the hamper by hand, and not washed since.
const manualDirty = code => { const t = (S.laundry?.dirtied || {})[code]; return !!t && t > washStamp(code); };
// Pooled pieces: many identical pairs (qty > 1, e.g. the black Nike socks). Each wear uses up one clean pair
// until the next full laundry, so we show pairs clean / in the hamper instead of flagging the whole piece.
const poolSize = code => { const q = +(item(code)?.qty || 0); return q > 1 ? q : 0; };
const pairsUsed = code => Math.min(poolSize(code), wearsSinceWash(code));

  if (poolSize(code)) return pairsClean(code) <= 0;   // only "dirty" once every pair is used
  if (manualDirty(code)) return true;

// What the hamper strip counts: pieces, except pooled pieces count by pair.
const hamperCount = () => items().reduce((n, i) => n + (poolSize(i.code) ? pairsUsed(i.code) : isDirty(i.code) ? 1 : 0), 0);

const todayPlan = () => (S.log?.planned || []).find(p => p.date === todayStr());

/* ---------------- images ---------------- */
const CUT_V = 2;   // bump when cut/ photos are re-made: the service worker caches them forever by URL
const imgCache = new Map();
function photoSrc(path) {

  if (path.startsWith("blob:") || path.startsWith("data:")) return path;

  return "";
}
async function loadPrivatePhoto(path) {
  const key = new Request(`/__private/${path}`);
  try {
    const c = await caches.open("rail-private");
    let r = await c.match(key);

}
const img = (path, alt = "", cls = "") => `<img ${cls ? `class="${cls}"` : ""} data-p="${esc(path)}" src="${esc(photoSrc(path))}" alt="${esc(alt)}" loading="lazy" decoding="async">`;

async function compress(file, max = 1400) {
  const bmp = await createImageBitmap(file, {imageOrientation:"from-image"});
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(ok => c.toBlob(ok, "image/jpeg", .82));

/* ---------------- ui helpers ---------------- */
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2600); }
function setSync() {
  const el = $("#sync"); if (!el) return;
  el.className = "sync" + (!online || queue.length ? " off" : "");
  el.textContent = syncing ? "Syncing…" : !online ? `Offline · ${queue.length} to sync` : queue.length ? `${queue.length} to sync` : S.synced ? "Synced" : "";
}

  sh.innerHTML = `<div class="grab"></div>${html}`; sh.hidden = sc.hidden = false;
  requestAnimationFrame(() => { sh.classList.add("on"); sc.classList.add("on"); });
  sc.onclick = closeSheet; onMount && onMount(sh);
  const f = sh.querySelector("button,input"); f && f.focus({preventScroll:true});
}
function closeSheet() {
  const sh = $("#sheet"), sc = $("#scrim");
  sh.classList.remove("on"); sc.classList.remove("on");
  setTimeout(() => { sh.hidden = sc.hidden = true; sh.innerHTML = ""; }, 250);
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });
// swipe a sheet down to close it (from the top of its content, or from the grab bar anywhere)
(() => {
  const sh = $("#sheet"), sc = $("#scrim");
  let y0 = null, x0 = 0, dy = 0, t0 = 0, drag = false;
  sh.addEventListener("touchstart", e => {
    if (e.touches.length !== 1) { y0 = null; return; }
    const fromGrab = !!e.target.closest(".grab");
    if (!fromGrab && sh.scrollTop > 0) { y0 = null; return; }
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0; t0 = Date.now(); drag = false;
  }, {passive: true});
  sh.addEventListener("touchmove", e => {
    if (y0 === null) return;
    const t = e.touches[0], d = t.clientY - y0, dx = t.clientX - x0;
    if (!drag) {
      if (d > 8 && Math.abs(d) > Math.abs(dx) * 1.2) { drag = true; sh.style.transition = "none"; sc.style.transition = "none"; }
      else if (Math.abs(d) > 8 || Math.abs(dx) > 8) { y0 = null; return; }
      else return;
    }
    dy = Math.max(0, d); e.preventDefault();
    sh.style.transform = `translateY(${dy}px)`; sc.style.opacity = String(Math.max(0, 1 - dy / 450));
  }, {passive: false});
  const end = () => {
    if (drag) {
      const fast = dy / Math.max(1, Date.now() - t0) > 0.6;
      sh.style.transition = sc.style.transition = "";
      if (dy > 110 || (fast && dy > 40)) closeSheet();
      sh.style.transform = ""; sc.style.opacity = "";
    }
    y0 = null; drag = false;
  };
  sh.addEventListener("touchend", end); sh.addEventListener("touchcancel", end);
})();

/* ---------------- colour: every piece gets a swatch from the words in its colour ---------------- */
const COLOURS = [["light denim","#A7B8CC"],["light blue","#A9C4DE"],["dark brown","#4A3325"],["dark charcoal","#2E2F31"],["dark grey","#4A4B4E"],
  ["forest green","#2F5B3F"],["heather grey","#A3A5A6"],["off-white","#EFEDE6"],["navy black","#1A2030"],["black","#1B1B1B"],["white","#F4F4F1"],
  ["cream","#E9E1CF"],["oatmeal","#DCCFB8"],["beige","#CDBB9A"],["khaki","#B9A57E"],["tan","#C29A6B"],["camel","#B88A55"],["brown","#6B4A33"],
  ["rust","#9A4A2A"],["orange","#E07A2E"],["red","#B33A2E"],["burgundy","#6E2233"],["navy","#1F2A44"],["royal","#2C4DA0"],["blue","#3B5C9A"],
  ["denim","#7C93B0"],["forest","#2F5B3F"],["olive","#56603A"],["sage","#9CB09A"],["mint","#A8D5C2"],["teal","#4F8C88"],["green","#3F7A4A"],
  ["charcoal","#3A3B3D"],["heather","#A3A5A6"],["grey","#8A8D90"],["gray","#8A8D90"],["lilac","#B9A6E0"],["purple","#6B4E9A"],["pink","#E3A5B8"],
  ["yellow","#E8C547"],["gold","#C9A045"]];
function colourOf(str) {   // the earliest colour word wins ("white / green" is white); a longer phrase beats its own last word
  const s = String(str || "").toLowerCase(); let best = null, at = 1e9;
  for (const [k, h] of COLOURS) { const i = s.indexOf(k); if (i >= 0 && (i < at || (i === at && k.length > best[0].length))) { at = i; best = [k, h]; } }
  return best ? {name: best[0], hex: best[1]} : {name: "other", hex: "#9A9790"};
}
const rgbOf = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const lum = h => { const [r, g, b] = rgbOf(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * r + .7152 * g + .0722 * b; };
const chroma = h => { const c = rgbOf(h); return Math.max(...c) - Math.min(...c); };
const fcOf = code => colourOf(item(code)?.colour).hex;
const isCut = p => !!p && p.startsWith("tiles/");
const rawCls = p => isCut(p) ? "" : "raw";
const TORSO_RANK = {outerwear:0, knit:1, hoodie:1, crewneck:1, collared:2, tee:3};
const torso = codes => codes.filter(c => ["layer", "top"].includes(item(c)?.slot))
  .sort((a, b) => ((item(a).slot === "layer" ? -10 : 0) + (TORSO_RANK[item(a).type] ?? 2)) - ((item(b).slot === "layer" ? -10 : 0) + (TORSO_RANK[item(b).type] ?? 2)));
// A look's colour: the first piece with real colour (outer layer first), else whatever it's mostly made of.
function leadOf(codes) {
  const order = [...torso(codes), ...codes.filter(c => item(c)?.slot === "bottom")].map(fcOf);
  return order.find(h => chroma(h) > 30 && lum(h) < .75) || order[0] || "#8A8780";
}
const fcStyle = codes => { const h = leadOf(codes); return `--fc:${h};--fcmix:${lum(h) > .45 ? "0%" : "75%"}`; };
const ICON = {
  gear: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>`,
  pen: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`,
  clock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
  prev: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>`,
  next: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>`,
};
const GEAR = `<button class="gear" data-tab="settings" aria-label="Settings">${ICON.gear}</button>`;

// Stagger the bob so pieces never move in step (seconds into the loop).
const BOB_DELAYS = [0, -1.1, -2.3, -3.2, -0.6, -1.7, -2.8, -3.7];
function qtyHtml(code) {
  const pool = poolSize(code); if (!pool) return "";
  const clean = pairsClean(code);
  return `<span class="qty${clean <= Math.ceil(pool * .15) ? " low" : ""}" title="${clean} of ${pool} pairs clean">×${clean}</span>`;
}
// A tile: the cut-out on a soft swatch of its own colour (Closet, Diary, rails).
function pieceHtml(code, {extra = ""} = {}) {
  const it = item(code);
  if (!it) return `<div class="piece tile"><div class="ph"></div><div class="nm">Unknown piece</div></div>`;
  const dirty = isDirty(code), pool = poolSize(code), clean = pool ? pairsClean(code) : 0;
  return `<div class="piece tile${dirty ? " dirty" : ""}${it.avoid ? " hidden-item" : ""}" data-sx-key="${esc(code)}" style="--fc:${fcOf(code)}">${extra}${qtyHtml(code)}
    <div class="ph">${img(it.photo, it.name, rawCls(it.photo))}${dirty && !pool ? `<span class="hp">HAMPER</span>` : ""}</div>
    <div class="nm">${esc(it.name)}</div><div class="cl">${pool ? `${clean} of ${pool} pairs clean` : dirty ? "In the hamper" : esc(it.colour)}${it.avoid ? " · hidden" : ""}</div></div>`;
}

/* A flat lay: pieces placed like a styled product shot. Outer layer in front, what's under it peeking out,
   pants to the right, shoes and socks low, cap up top. Positions are % of a square-ish stage. */
const LAY = {
  torso: [{l:3,t:15,w:58,r:-4,z:3}, {l:30,t:4,w:46,r:6,z:1}, {l:0,t:38,w:40,r:-11,z:0}],
  bottom: [{l:55,t:31,w:42,r:3,z:2}], shoes: [{l:5,t:57,w:29,r:-7,z:4}], socks: [{l:37,t:67,w:10,r:12,z:4}], cap: [{l:1,t:0,w:24,r:-10,z:5}],
  extra: [{l:66,t:2,w:24,r:8,z:2}, {l:70,t:72,w:24,r:-6,z:4}, {l:46,t:82,w:20,r:5,z:4}, {l:84,t:44,w:16,r:-8,z:4}, {l:22,t:84,w:18,r:9,z:4}],
};
function layHtml(codes, {bob = true} = {}) {
  const known = codes.filter(c => item(c)), placed = [], used = {torso:0, bottom:0, shoes:0, socks:0, cap:0, extra:0};
  const take = (k, c) => { const spot = LAY[k][used[k]]; if (spot) { used[k]++; placed.push([c, spot]); return true; } return false; };
  const rest = [];
  torso(known).forEach(c => take("torso", c) || rest.push(c));
  known.filter(c => !["layer", "top"].includes(item(c).slot)).forEach(c => {
    const s = item(c).slot; if (!(LAY[s] && take(s, c))) rest.push(c);
  });
  rest.forEach((c, i) => take("extra", c) || placed.push([c, {l: 4 + (i % 5) * 19, t: 88, w: 14, r: 0, z: 6}]));
  return `<div class="lay${bob ? " bob" : ""}">${placed.map(([c, p], i) => {
    const it = item(c), dirty = isDirty(c), pool = poolSize(c);
    return `<button class="piece lp${dirty ? " dirty" : ""}" data-sx-key="${esc(c)}" data-act="item" data-code="${esc(c)}" aria-label="${esc(it.name)}"
      style="left:${p.l}%;top:${p.t}%;width:${p.w}%;z-index:${p.z};--r:${p.r}deg;--d:${BOB_DELAYS[i % BOB_DELAYS.length]}s">${img(it.photo, "", rawCls(it.photo))}${qtyHtml(c)}${dirty && !pool ? `<span class="tg">HAMPER</span>` : ""}</button>`;
  }).join("")}</div><p class="legend">${bySlot(known).map(c => esc(item(c).name)).join(" · ")}</p>`;
}
// One look on its studio set. Shared by Today and Suggest fits.
function lookHtml({n, total, name, when, note, noteLabel = "Styling note", codes, acts, bob = true}) {
  return `<article class="fit" style="${fcStyle(codes)}"><div class="fit-head"><h2>${esc(name)}</h2>
      ${total ? `<div class="cnt"><span class="k">Look</span><b>${n}<i>/${total}</i></b></div>` : ""}</div>
    ${when ? `<p class="k when">${esc(when)}</p>` : ""}
    ${layHtml(codes, {bob})}
    ${note ? `<div class="swing"><p class="k">${esc(noteLabel)}</p><p>${esc(note)}</p></div>` : ""}
    <div class="actions">${acts}</div></article>`;
}

// Only pieces on screen bob: an observer toggles .on, so off-screen looks cost nothing.
// With Reduce Motion on, nothing is observed and nothing moves.
const bobMotion = window.matchMedia ? matchMedia("(prefers-reduced-motion: reduce)") : null;
let bobIO = null;
function watchBob() {
  if (bobIO) { bobIO.disconnect(); bobIO = null; }
  if ((bobMotion && bobMotion.matches) || !("IntersectionObserver" in window)) return;
  const cards = document.querySelectorAll(".lay.bob .lp");
  if (!cards.length) return;
  bobIO = new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle("on", e.isIntersecting)), {rootMargin: "40px"});
  cards.forEach(c => bobIO.observe(c));
}
if (bobMotion && bobMotion.addEventListener) bobMotion.addEventListener("change", () => {
  if (bobMotion.matches) document.querySelectorAll(".lay.bob .lp.on").forEach(c => c.classList.remove("on"));
  watchBob();
});

/* ---------------- views ---------------- */
let lookIdx = 0;
function render() {
  if (!configured() && tab !== "settings") tab = "settings";
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
  const bd = $("#hbdg"); if (bd) bd.textContent = S.log ? (hamperCount() || "") : "";
  const v = $("#view");
  const opened = tab === "settings" ? [...v.querySelectorAll("details[open]")].map(d => d.className) : [];   // a sync redraw keeps open panels open
  v.innerHTML = ({today:viewToday, closet:viewCloset, hamper:viewHamper, worn:viewWorn, settings:viewSettings}[tab])();
  if (tab === "today") mountLooks();
  opened.forEach(c => { const d = c && v.querySelector("details." + c.split(" ")[0]); if (d) d.open = true; });
  if (tab === "settings") { if (!(cfg.session && cfg.me)) mountGsi(); else if (cfg.me.owner && invites === null) { invites = {invites: null}; loadInvites(); } }
  watchBob();
  setSync();
}
// The looks slide sideways; the dots follow, and a redraw (after a sync) keeps you on the look you were on.
function mountLooks() {
  const row = $("#looks"); if (!row) return;
  const slides = [...row.children];
  lookIdx = Math.min(lookIdx, slides.length - 1);
  if (lookIdx > 0) row.scrollLeft = slides[lookIdx].offsetLeft - slides[0].offsetLeft;
  const mark = () => document.querySelectorAll(".dots button").forEach((b, i) => b.setAttribute("aria-current", String(i === lookIdx)));
  mark();
  row.addEventListener("scroll", () => {
    const x = row.scrollLeft, w = slides[1] ? slides[1].offsetLeft - slides[0].offsetLeft : 1;
    const i = Math.max(0, Math.min(slides.length - 1, Math.round(x / w)));
    if (i !== lookIdx) { lookIdx = i; mark(); }
  }, {passive: true});
}
function goLook(i) {
  const row = $("#looks"); if (!row) return;
  const slides = [...row.children]; lookIdx = i;
  row.scrollTo({left: slides[i].offsetLeft - slides[0].offsetLeft, behavior: bobMotion && bobMotion.matches ? "auto" : "smooth"});
  document.querySelectorAll(".dots button").forEach((b, k) => b.setAttribute("aria-current", String(k === i)));
}

function mast(kicker, title, {sub = "", count = null} = {}) {
  return `<header class="mast"><div class="row"><span class="k">${esc(kicker)}</span><div class="right"><span id="sync" class="sync"></span>${GEAR}</div></div>
    <div class="big"><h1>${esc(title)}</h1>${count != null ? `<span class="n">${count}</span>` : ""}</div>${sub ? `<p class="sub">${esc(sub)}</p>` : ""}</header>`;
}
function wxChips(sub) {   // "Provo: 50°F high / 32°F low · sunny · Chem 11" → PROVO 50° / 32° · SUNNY · CHEM 11
  if (!sub) return "";
  const m = /^([^:·]{2,30}):\s*/.exec(sub), place = m ? m[1] : "";
  const parts = (m ? sub.slice(m[0].length) : sub).replace(/°F high \/ /, "° / ").replace(/°F low/, "°").split(/\s*·\s*/).filter(Boolean);
  if (place && parts.length) parts[0] = place + " " + parts[0];
  return `<div class="wx">${parts.map(p => `<span>${esc(p)}</span>`).join("")}</div>`;
}

function viewToday() {
  const d = new Date(), plan = todayPlan(), worn = wornOn(todayStr());
  const date = d.toLocaleDateString("en-US", {weekday:"short"}) + " · " + d.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
  const hn = hamperCount();
  let out = `<header class="mast"><div class="row"><span class="k">${esc(date)}</span><div class="right"><span id="sync" class="sync"></span>${GEAR}</div></div>
    ${plan ? wxChips(plan.subtitle) : ""}</header>`;
  out += `<div class="hamper"><span class="grow"><span class="dotp${hn ? "" : " ok"}" aria-hidden="true"></span>${hn ? `<span><b>${hn}</b> in the hamper</span>` : "Hamper's empty"}</span>
    ${hn ? `<button class="btn small ghost" data-tab="hamper">Open</button><button class="btn small" data-act="laundry">Did laundry</button>` : ""}</div>`;
  if (worn.length) out += `<p class="worn-badge" style="margin-top:12px">${ICON.check} Logged today: ${worn.map(w => esc(w.name)).join(", ")}</p>`;
  if (!S.log) return out + `<div class="empty"><h3>Loading your closet</h3>Pulling your closet down.</div>`;
  if (!items().length) return out + `<div class="empty"><h3>Your closet is empty</h3>Add a few pieces: a couple of tops, a pair of pants, shoes. Fits show up here once there's enough to mix.
      <div class="actions"><button class="btn primary" data-act="add-item">Add a piece</button></div></div>`;
  if (!plan) {
    const last = (S.log.planned || [])[0];
    return out + `<div class="empty"><h3>No looks yet today</h3>${isOwnerUser() ? "The morning sheet lands at 6:59am." : "Tap Suggest fits and The Rail builds some from your closet and today's weather."}${last ? ` The last one was ${new Date(last.date + "T12:00").toLocaleDateString("en-US", {weekday:"long"})}.` : ""}
      <div class="actions"><button class="btn primary" data-act="suggest">Suggest fits</button><button class="btn ghost" data-act="log-own">Build my own fit</button></div></div>`;
  }
  const total = plan.fits.length;
  out += `<div class="looks" id="looks">${plan.fits.map(f => {
    const isWorn = worn.some(w => w.from_plan === `${plan.date}#${f.n}`);
    const acts = (isWorn ? `<button class="btn big" data-act="wear" data-n="${f.n}">${ICON.check} Logged · Edit</button>`
      : `<button class="btn primary big" data-act="wear" data-n="${f.n}">${ICON.check} Wearing this</button>`)
      + (isOwnerUser() ? `<button class="btn round" data-act="tweak" data-n="${f.n}" aria-label="Tweak in Claude" title="Tweak in Claude">${ICON.pen}</button>` : "");
    return lookHtml({n: f.n, total, name: f.name, when: f.when, note: f.note, codes: f.items, acts});
  }).join("")}</div>`;
  if (total > 1) out += `<div class="dots" role="group" aria-label="Looks">${plan.fits.map((f, i) => `<button data-look="${i}" aria-label="Look ${i + 1}: ${esc(f.name)}" aria-current="${i === lookIdx}"></button>`).join("")}</div>`;
  out += `<div class="more"><button class="btn ghost" data-act="suggest">Suggest more fits</button><button class="btn ghost" data-act="log-own">Wore something else? Build it</button></div>`;
  return out;
}

let closetFilter = "all";
function colourGroups(list) {
  const m = new Map();
  list.forEach(i => { const c = colourOf(i.colour), g = m.get(c.hex) || {hex: c.hex, name: c.name, n: 0}; g.n++; m.set(c.hex, g); });
  return [...m.values()].sort((a, b) => b.n - a.n);
}
function viewCloset() {
  const all = items(), hl = inHamperList();
  const list = closetFilter === "all" ? all : closetFilter === "hamper" ? hl
    : closetFilter.startsWith("#") ? all.filter(i => colourOf(i.colour).hex === closetFilter) : all.filter(i => i.slot === closetFilter);
  const groups = colourGroups(all.filter(i => !i.avoid)), byC = closetFilter.startsWith("#");
  const named = groups.slice(0, 3).map(g => g.name);
  const chips = [["all", `All ${all.length}`], ...SLOTS, ["hamper", `Hamper ${hl.length}`]];
  return mast("Your", "Closet", {count: null}) +
    `<p class="k" style="margin-top:8px">${all.filter(i => !i.avoid).length} pieces in rotation · ${hl.length} in the hamper</p>
    <div class="cbar${byC ? " sel" : ""}" role="group" aria-label="Filter by colour">${groups.map(g => `<button data-filter="${g.hex}" aria-pressed="${closetFilter === g.hex}"
      aria-label="${esc(g.name)}: ${g.n}" title="${esc(g.name)} · ${g.n}" style="flex:${g.n};background:${g.hex}${lum(g.hex) > .75 ? ";box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)" : ""}"></button>`).join("")}</div>
    <div class="cbar-k"><span class="k">${byC ? `Showing ${esc(colourOf(list[0]?.colour).name)}` : `Mostly ${esc(named.slice(0, -1).join(", "))}${named.length > 1 ? " + " : ""}${esc(named[named.length - 1] || "")}`}</span><span class="k">${groups.length} colours</span></div>
    <div class="filters" role="group" aria-label="Filter">${chips.map(([k, l]) => `<button class="chip" aria-pressed="${closetFilter === k}" data-filter="${k}">${esc(l)}</button>`).join("")}</div>
    <div class="grid">${list.map(i => pieceHtml(i.code, {extra:`<button class="hit" data-act="item" data-code="${i.code}" aria-label="${esc(i.name)}"></button>`})).join("") || `<p class="mini-list">Nothing here.</p>`}</div>
    <button class="fab" data-act="add-item" aria-label="Add a piece">${ICON.plus}</button>`;
}

/* ---------------- hamper ---------------- */
const hashOf = s => [...String(s)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
const PILE = [[6,40,34],[52,22,34],[28,70,36],[60,96,30],[3,128,36],[40,140,30],[72,8,24],[22,4,26],[76,150,22],[46,180,24],[12,190,24],[64,184,22]];
const PILE_FEW = [[12,34,42],[50,52,38],[30,96,36]];   // a small pile sits in the middle instead of spread out
const LOADS = [["darks", "Darks", "#1B1B1B"], ["colours", "Colours", "#C9442A"], ["lights", "Lights", "#F4F4F1"]];
function loadOf(it) { const h = colourOf(it.colour).hex, L = lum(h), C = chroma(h); return L > .35 ? "lights" : C > 60 && L > .07 ? "colours" : "darks"; }
const daysSince = iso => iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 864e5) : null;
function viewHamper() {
  const list = inHamperList(), hn = hamperCount(), all = items();
  const spots = list.length <= 3 ? PILE_FEW : PILE;
  const pile = list.slice(0, spots.length).map((it, i) => {
    const h = hashOf(it.code), [l, t, w] = spots[i], small = ["socks", "cap"].includes(it.slot);
    return `<img src="${esc(photoSrc(it.photo))}" data-p="${esc(it.photo)}" alt="" class="${rawCls(it.photo)}" style="left:${l}%;top:${t}px;width:${small ? w * .45 : w}%;transform:rotate(${(h % 51) - 25}deg)${isCut(it.photo) ? "" : ";border-radius:12px"}">`;
  }).join("");
  const tees = all.filter(i => i.type === "tee" && !i.avoid && !isDirty(i.code)).length, since = daysSince(S.laundry?.last_full);
  let alert = "";
  if (hn && tees <= 2) alert = [`Do a load soon`, `You're down to ${tees} clean tee${tees === 1 ? "" : "s"}.`];
  else if (hn && since != null && since >= 10) alert = [`It's been ${since} days since a full wash`, `${hn} piece${hn === 1 ? " is" : "s are"} waiting.`];
  const loads = LOADS.map(([k, label, sw]) => {
    const inLoad = list.filter(it => loadOf(it) === k); if (!inLoad.length) return "";
    const n = inLoad.reduce((s, it) => s + (poolSize(it.code) ? pairsUsed(it.code) : 1), 0);
    return `<div class="load"><div class="top"><span class="sw" style="background:${sw}" aria-hidden="true"></span>
      <div class="t"><b>${label}</b><span class="k">${n} piece${n === 1 ? "" : "s"}</span></div>
      <button class="btn small" data-act="wash-load" data-codes="${inLoad.map(i => i.code).join(",")}">Washed</button></div>
      <p>${inLoad.map(it => esc(it.name) + (poolSize(it.code) ? ` ×${pairsUsed(it.code)}` : "")).join(", ")}</p></div>`;
  }).join("");
  const clean = all.filter(i => !isDirty(i.code)).length;
  return mast("Laundry", "Hamper", {count: hn}) +
    `<div class="pile" aria-hidden="true">${pile || `<p class="none">Nothing in the hamper. Everything's clean.</p>`}</div>
    ${alert ? `<div class="alert">${ICON.clock}<div><b>${esc(alert[0])}</b><span>${esc(alert[1])}</span></div></div>` : ""}
    <div class="loads">${loads}</div>
    ${hn ? `<div class="actions"><button class="btn primary big" data-act="laundry" data-label="Did all the laundry">Did all the laundry</button></div>` : ""}

let diaryOff = 0;
function viewWorn() {
  const worn = S.log?.worn || [], today = todayStr();
  const base = new Date(); base.setDate(1); base.setMonth(base.getMonth() - diaryOff);
  const y = base.getFullYear(), m = base.getMonth(), ym = `${y}-${String(m + 1).padStart(2, "0")}`;
  const inMonth = worn.filter(x => x.date.startsWith(ym)), byDay = {};
  inMonth.forEach(x => (byDay[x.date] = byDay[x.date] || []).push(x));
  const earliest = worn.reduce((a, x) => x.date < a ? x.date : a, today).slice(0, 7);
  const pad = new Date(y, m, 1).getDay(), nd = new Date(y, m + 1, 0).getDate();
  const leadPiece = x => torso(x.items.filter(c => item(c)))[0] || x.items.find(c => item(c));
  let cells = ["S","M","T","W","T","F","S"].map(w => `<span class="wd" aria-hidden="true">${w}</span>`).join("") + `<span class="d pad"></span>`.repeat(pad);
  for (let dd = 1; dd <= nd; dd++) {
    const ds = `${ym}-${String(dd).padStart(2, "0")}`, es = byDay[ds], cls = ds === today ? " today" : ds > today ? " fut" : "";
    if (es) {
      const c = leadPiece(es[0]), it = item(c);
      cells += `<button class="d has${cls}" data-act="day" data-d="${ds}" style="--fc:${fcOf(c)}" aria-label="${esc(new Date(ds + "T12:00").toLocaleDateString("en-US", {month:"long", day:"numeric"}))}: ${esc(es.map(e => e.name).join(", "))}"><i>${dd}</i>${it ? img(it.photo, "", rawCls(it.photo)) : ""}</button>`;
    } else cells += `<span class="d${cls}"><i>${dd}</i></span>`;
  }
  const counts = {}; (inMonth.length ? inMonth : worn).forEach(x => x.items.forEach(c => counts[c] = (counts[c] || 0) + 1));
  const top = Object.entries(counts).filter(([c]) => item(c)).sort((a, b) => b[1] - a[1]).slice(0, 4);
  const since = new Date(Date.now() - 30 * 864e5).toLocaleDateString("en-CA");
  const recent = new Set(worn.filter(x => x.date >= since).flatMap(x => x.items));
  const idle = items().filter(i => !i.avoid && !recent.has(i.code) && !["socks"].includes(i.slot));
  const pickIdle = idle.length ? idle[Math.floor(Date.now() / 864e5) % idle.length] : null;
  const monthName = base.toLocaleDateString("en-US", {month:"long"});
  const seen = new Set();
  let out = `<header class="mast"><div class="row"><span class="k">Diary · ${y}</span><div class="right"><span id="sync" class="sync"></span>${GEAR}</div></div>
    <div class="big"><h1>${esc(monthName)}</h1><div style="text-align:right;padding-bottom:4px"><span class="n" style="font-size:44px;color:var(--text)">${inMonth.length}</span><p class="k">fits logged</p></div></div></header>
    <div class="actions" style="justify-content:space-between"><button class="btn small" data-act="log-own">${ICON.plus} Log a fit</button>
      <div class="cal-nav"><button data-act="month" data-m="1" aria-label="Previous month" ${ym <= earliest ? "disabled" : ""}>${ICON.prev}</button><button data-act="month" data-m="-1" aria-label="Next month" ${diaryOff ? "" : "disabled"}>${ICON.next}</button></div></div>
    <div class="cal">${cells}</div>`;
  if (top.length) out += `<h2 class="sect">On repeat <span class="k">${inMonth.length ? "This month" : "All time"}</span></h2>
    <div class="repeat">${top.map(([c, n]) => `<div class="piece tile" style="--fc:${fcOf(c)}"><button class="hit" data-act="item" data-code="${c}" aria-label="${esc(item(c).name)}, worn ${n} times"></button>
      <div class="ph">${img(item(c).photo, "", rawCls(item(c).photo))}</div><div class="cl">${n}×</div></div>`).join("")}</div>`;
  if (pickIdle) out += `<button class="nudge" data-act="build-with" data-code="${pickIdle.code}" style="--fc:${fcOf(pickIdle.code)}"><span class="ph">${img(pickIdle.photo, "", rawCls(pickIdle.photo))}</span>

  out += `<h2 class="sect">${esc(monthName)} fits</h2>`;
  if (!inMonth.length) out += `<div class="empty"><h3>Nothing logged</h3>${diaryOff ? "No fits this month." : "Tap “Wearing this” on a look and it shows up here."}</div>`;
  out += inMonth.map(x => {
    const id = seen.has(x.date) ? "" : (seen.add(x.date), ` id="e-${x.date}"`);
    return `<div class="entry"${id}><div class="top"><h3>${esc(x.name)}</h3><span class="k d">${esc(new Date(x.date + "T12:00").toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric"}))}</span></div>
    <div class="strip">${x.photo ? img(x.photo, "Mirror pic", "selfie") : ""}${bySlot(x.items).map(c => item(c) ? `<span class="sw" style="--fc:${fcOf(c)}">${img(item(c).photo, item(c).name, rawCls(item(c).photo))}</span>` : "").join("")}</div>
    ${x.worked ? `<p class="fb g">+ ${esc(x.worked)}</p>` : ""}${x.didnt ? `<p class="fb b">− ${esc(x.didnt)}</p>` : ""}
    ${(x.uncatalogued || []).length ? `<p class="mini-list">Also: ${x.uncatalogued.map(u => esc(u.name)).join(", ")}</p>` : ""}</div>`;
  }).join("");
  if (idle.length > 1) out += `<h2 class="sect">Not worn in 30 days <span class="k">${idle.length}</span></h2><p class="mini-list">${idle.map(i => esc(i.name)).join(" · ")}</p>`;
  return out;
}

async function onGoogle(resp) {

      Object.assign(cfg, {session: j.token, me: j.me}); ls("rail.cfg", cfg);

function download(name, text) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type: "application/json"})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ---------------- flows ---------------- */
// What the wear sheet says under each piece: how close it is to the hamper once this wear counts.
function wearNote(c, logged) {
  const it = item(c); if (!it) return {t: "", warn: false};
  const pool = poolSize(c);
  if (pool) return {t: `${it.colour} · ${pairsClean(c)} of ${pool} pairs clean`, warn: false};
  if (isDirty(c) && !logged) return {t: `${it.colour} · in the hamper`, warn: true};
  const lim = (S.laundry?.wash_after || {})[it.type] || 0;
  if (!lim) return {t: it.colour, warn: false};
  const left = lim - wearsSinceWash(c) - (logged ? 0 : 1);
  return {t: `${it.colour} · ${left <= 0 ? "hamper after this" : `${left} more wear${left === 1 ? "" : "s"} before a wash`}`, warn: left <= 0};
}
function wearSheet({date, name, when, items: codes, n, weather, kind}) {
  const existing = wornOn(date).find(w => n ? w.from_plan === `${date}#${n}` : w.name === name);
  const st = {items:[...(existing?.items || codes)], name: existing?.name || name, photo:null, photoUrl: existing?.photo ? photoSrc(existing.photo) : ""};
  const paint = sh => {
    sh.innerHTML = `<div class="grab"></div><h2>${n ? "Wearing it" : "Log a fit"}</h2><p class="lead">${date !== todayStr() ? `For ${dayName(date)}. ` : ""}Swap anything that's different. Each piece counts toward the hamper.</p>
      ${n ? "" : `<label class="f">Name it<input id="w-name" value="${esc(st.name)}" placeholder="e.g. Gym then class"></label>`}
      <div class="rows">${st.items.map((c, i) => { const it = item(c), wn = wearNote(c, !!existing); return `<div class="prow" data-code="${esc(c)}"><span class="th" style="--fc:${fcOf(c)}">${img(it?.photo, "", rawCls(it?.photo))}</span>
        <div class="t"><b>${esc(it?.name || "Unknown piece")}</b><span class="${wn.warn ? "warn" : ""}">${esc(wn.t)}</span></div>
        <button class="btn small" data-w="swap" data-i="${i}">Swap</button><button class="btn small ghost" data-w="drop" data-i="${i}" aria-label="Remove">✕</button></div>`; }).join("")}</div>
      <div class="actions"><button class="btn small" data-w="add">Add a piece</button></div>
      <div class="photo-pick">${st.photoUrl ? `<img src="${esc(st.photoUrl)}" alt="Mirror pic">` : ""}
        <label class="btn small"> ${st.photoUrl ? "Change mirror pic" : "Add mirror pic"}<input type="file" accept="image/*" id="w-photo" class="sr"></label></div>
      <label class="f">What worked?<textarea id="w-good" placeholder="Optional">${esc(existing?.worked || "")}</textarea></label>
      <label class="f">What didn't?<textarea id="w-bad" placeholder="Optional">${esc(existing?.didnt || "")}</textarea></label>
      <div class="sheet-actions">${existing ? `<button class="btn ghost warn" data-w="unlog">Remove log</button>` : `<button class="btn ghost" data-w="cancel">Cancel</button>`}
        <button class="btn primary" data-w="save" ${st.items.length ? "" : "disabled"}>${existing ? "Save changes" : "Log it"}</button></div>`;
  };
  const keep = sh => {
    if ($("#w-good", sh)) st.worked = $("#w-good", sh).value;
    if ($("#w-bad", sh)) st.didnt = $("#w-bad", sh).value;
    if ($("#w-name", sh)) st.name = $("#w-name", sh).value;
  };
  openSheet("", sh => {
    const fill = () => { paint(sh); $("#w-good", sh).value = st.worked || ""; $("#w-bad", sh).value = st.didnt || ""; };
    const bind = () => { sh.onchange = onChange; sh.onclick = onClick; };
    paint(sh);
    const onChange = async e => {
      if (e.target.id !== "w-photo" || !e.target.files[0]) return;
      keep(sh); st.photo = await compress(e.target.files[0]); st.photoUrl = URL.createObjectURL(st.photo);
      fill();
    };
    const onClick = async e => {
      const b = e.target.closest("[data-w]"); if (!b) return;
      const act = b.dataset.w, i = +b.dataset.i;
      const repaint = () => { keep(sh); fill(); };
      if (act === "cancel") return closeSheet();
      if (act === "drop") { keep(sh); st.items.splice(i, 1); return repaint(); }
      if (act === "swap" || act === "add") {
        keep(sh);
        const slot = act === "swap" ? item(st.items[i])?.slot : null;
        return pickItem(sh, slot, act === "swap" ? st.items[i] : null, code => {
          if (code) { if (act === "swap") st.items[i] = code; else if (!st.items.includes(code)) st.items.push(code); }
          bind(); fill();
        });
      }
      if (act === "unlog") { run("unwear", {date, name: existing.name}); closeSheet(); return toast("Log removed"); }
      if (act === "save") {
        keep(sh);
        const rec = {date, name: (st.name || "").trim() || "Worn fit", items: st.items, uncatalogued: existing?.uncatalogued || [],
          from_plan: n ? `${date}#${n}` : null, occasion: when || "", worked: (st.worked || "").trim(), didnt: (st.didnt || "").trim(),
          notes: existing?.notes || "", photo: existing?.photo || null, logged_at: existing?.logged_at || nowIso(), source: "app"};
        // weather and occasion kind let the fit engine learn from this wear (only fits started from Suggest have them)
        const wx = weather || existing?.weather, k = kind || existing?.kind;
        if (wx) rec.weather = {hi: Math.round(wx.hi), lo: Math.round(wx.lo), rain: Math.round(wx.rain || 0), snow: !!wx.snow, wind: Math.round(wx.wind || 0)};
        if (k) rec.kind = k;
        const payload = {rec};
        if (st.photo) {
          const slug = rec.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 30) || "fit";
          rec.photo = `photos/worn/${date}_${slug}-${Math.random().toString(36).slice(2, 6)}.jpg`;
          payload.upload = {path: rec.photo, b64: await blobToB64(st.photo)};
          imgCache.set(rec.photo, st.photoUrl);
        }
        if (existing && existing.name !== rec.name) run("unwear", {date, name: existing.name});
        run("wore", payload); closeSheet(); toast(existing ? "Saved" : "Logged. Have a good one.");
      }
    };
    bind();
  });
}

const SLOT_ORDER = ["layer", "top", "bottom", "socks", "shoes", "cap"];
const bySlot = codes => [...codes].sort((a, b) => SLOT_ORDER.indexOf(item(a)?.slot) - SLOT_ORDER.indexOf(item(b)?.slot));
const dayName = d => {

  return d === todayStr() ? "today" : d === y ? "yesterday" : new Date(d + "T12:00").toLocaleDateString("en-US", {weekday:"long", month:"short", day:"numeric"});
};

// Build a fit from scratch: pick a day, tap pieces across every slot, then name/log it in the wear sheet.
function buildFit(start = {}) {
  const yday = new Date(Date.now() - 864e5).toLocaleDateString("en-CA");

      const custom = st.date !== todayStr() && st.date !== yday;
      sh.innerHTML = `<div class="grab"></div><h2>Build a fit</h2><p class="lead">Tap everything you wore. Tap again to drop it.</p>
        <div class="days" role="group" aria-label="Day">

          <button class="chip" aria-pressed="${st.date === yday}" data-b="day" data-d="${yday}">Yesterday</button>
          <input type="date" id="b-date" max="${todayStr()}" value="${custom ? st.date : ""}" aria-label="Other day"></div>
        <div class="picked">${st.sel.length ? bySlot(st.sel).map(c => `<button data-b="unpick" data-code="${c}" style="--fc:${fcOf(c)}" aria-label="Remove ${esc(item(c)?.name || "piece")}">${img(item(c)?.photo, "", rawCls(item(c)?.photo))}</button>`).join("")
          : `<span class="hint">Nothing picked yet.</span>`}</div>
        <div class="filters">${[["all", "All"], ...SLOTS].map(([k, l]) => `<button class="chip" aria-pressed="${st.f === k}" data-b="f" data-k="${k}">${l}</button>`).join("")}</div>
        <div class="picker">${list.map(i => `<button data-b="pick" data-code="${i.code}" aria-pressed="${st.sel.includes(i.code)}" class="${st.sel.includes(i.code) ? "sel" : ""} ${isDirty(i.code) ? "dirty" : ""}"><span class="sw" style="--fc:${fcOf(i.code)}">${img(i.photo, "", rawCls(i.photo))}</span><span>${esc(i.name)}${isDirty(i.code) ? " · hamper" : ""}</span></button>`).join("")}</div>
        <div class="sheet-actions"><button class="btn ghost" data-b="cancel">Cancel</button>
          <button class="btn primary" data-b="next" ${st.sel.length ? "" : "disabled"}>Next${st.sel.length ? ` · ${st.sel.length}` : ""}</button></div>`;
    };
    const keepScroll = fn => { const y = sh.scrollTop, px = $(".picked", sh)?.scrollLeft || 0; fn(); paint(); sh.scrollTop = y; const pk = $(".picked", sh); if (pk) pk.scrollLeft = px; };
    paint();
    sh.onchange = e => { if (e.target.id === "b-date" && e.target.value) { st.date = e.target.value > todayStr() ? todayStr() : e.target.value; keepScroll(() => {}); } };
    sh.onclick = e => {
      const b = e.target.closest("[data-b]"); if (!b) return;
      const a = b.dataset.b, c = b.dataset.code;
