      if (a === "day") return keepScroll(() => st.date = b.dataset.d);
      if (a === "f") return keepScroll(() => st.f = b.dataset.k);
      if (a === "pick") return keepScroll(() => st.sel.includes(c) ? st.sel.splice(st.sel.indexOf(c), 1) : st.sel.push(c));
      if (a === "unpick") return keepScroll(() => st.sel.splice(st.sel.indexOf(c), 1));
      if (a === "next") { sh.onclick = sh.onchange = null; wearSheet({date: st.date, name: "", when: "", items: bySlot(st.sel)}); }
    };
  });
}

/* ---------------- suggest fits (engine.js: free, no AI) ---------------- */
const WX_PRESETS = {cold: {hi: 38, lo: 27}, cool: {hi: 52, lo: 40}, mild: {hi: 66, lo: 50}, warm: {hi: 82, lo: 62}};
const OCCASIONS = [["class", "Class", "day"], ["lab", "Lab", "day"], ["lounge", "Chill", "evening"], ["out", "Out", "evening"], ["church", "Church", "day"]];
let wxCache = null, learned = {n: -1, w: null};
// Weights tuned to this person's own worn log (null until ~12 fits are logged; then the built-in weights are the starting point).
function learnedWeights() {
  const n = (S.log?.worn || []).length;
  if (n !== learned.n) { try { learned = {n, w: RailEngine.personalize({wardrobe: S.wardrobe, log: S.log, laundry: S.laundry || DEFAULTS["laundry.json"]()})}; } catch { learned = {n, w: null}; } }
  return learned.w;
}
function parseWx(sub) {   // "Provo: 48°F high / 32°F low · sunny · 0% rain · …" from the morning sheet
  const m = /(\d+)°F high \/ (\d+)°F low/.exec(sub || ""); if (!m) return null;
  const r = /(\d+)% rain/.exec(sub), w = /(\d+)(?:-(\d+))? mph/.exec(sub);
  return {hi: +m[1], lo: +m[2], rain: r ? +r[1] : 0, snow: /snow/i.test(sub), wind: w ? +(w[2] || w[1]) : 0};
}
async function loadWx() {   // today's sheet first, then a free forecast (Open-Meteo, no key), else null and the sheet asks
  const p = todayPlan(), fromPlan = p && parseWx(p.subtitle);
  if (fromPlan) return {wx: fromPlan, src: "today's sheet"};
  if (wxCache && wxCache.day === todayStr()) return wxCache;
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${cfg.lat || 40.2338}&longitude=${cfg.lon || -111.6585}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,snowfall_sum,wind_speed_10m_max&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto&forecast_days=1`;
    const r = await fetch(u, {signal: AbortSignal.timeout(6000)}); if (!r.ok) throw 0;
    const d = (await r.json()).daily;
    wxCache = {day: todayStr(), src: "forecast", wx: {hi: d.temperature_2m_max[0], lo: d.temperature_2m_min[0], rain: d.precipitation_probability_max[0] || 0, snow: (d.snowfall_sum[0] || 0) > .1, wind: d.wind_speed_10m_max[0] || 0}};
    return wxCache;
  } catch { return null; }
}
function suggestSheet() {
  if (!window.RailEngine) return toast("The fit engine didn't load. Reload the app.");
  const st = {kind: new Date().getHours() < 17 ? "class" : "lounge", salt: 0, wx: null, src: "", preset: null, rain: null, fits: [], shown: []};
  openSheet("", sh => {
    const weather = () => {
      const w = st.preset ? Object.assign({rain: 0, snow: false, wind: 0}, WX_PRESETS[st.preset]) : st.wx && Object.assign({}, st.wx);
      if (w && st.rain != null) w.rain = st.rain ? 80 : 0;
      return w;
    };
    const compute = () => {
      const w = weather(); st.problems = [];
      if (!w) return st.fits = [];
      const occ = OCCASIONS.find(o => o[0] === st.kind);
      const r = RailEngine.suggest({wardrobe: S.wardrobe, log: S.log || {worn: [], planned: []}, laundry: S.laundry || DEFAULTS["laundry.json"]()},
        {today: todayStr(), weather: w, occasion: {kind: st.kind, phase: occ[2]}, n: 3, salt: st.salt, exclude: st.shown, weights: learnedWeights() || undefined});
      st.problems = r.problems; st.fits = r.fits;
    };
    const paint = () => {
      const w = weather(), chip = (a, k, l, on) => `<button class="chip" aria-pressed="${on}" data-s="${a}" data-k="${k}">${l}</button>`;
      const line = w ? `${Math.round(w.lo)}–${Math.round(w.hi)}°F${w.rain >= 50 ? " · rain" : ""}${w.snow ? " · snow" : ""}${st.preset ? "" : ` · ${st.src}`}` : "Checking the forecast…";
      sh.innerHTML = `<div class="grab"></div><h2>Suggest fits</h2><p class="lead">${esc(line)}. Built from your closet, your hamper and what you've worn lately.</p>
        <div class="filters" role="group" aria-label="Occasion">${OCCASIONS.map(([k, l]) => chip("kind", k, l, st.kind === k)).join("")}</div>
        <div class="filters" role="group" aria-label="Weather">${Object.keys(WX_PRESETS).map(k => chip("wx", k, k[0].toUpperCase() + k.slice(1), st.preset === k)).join("")}${chip("rain", "", "Rain", !!(w && w.rain >= 50))}</div>
        ${st.fits.map((f, i) => lookHtml({n: i + 1, total: st.fits.length, name: f.name, codes: bySlot(f.items), bob: false, noteLabel: "Why this works",
          note: (f.why.length ? f.why.map((x, j) => j ? x : x[0].toUpperCase() + x.slice(1)).join(" · ") + "." : "") + (f.capOptional ? " Cap optional." : ""),
          acts: `<button class="btn primary big" data-s="wear" data-i="${i}">${ICON.check} Wearing this</button>`})).join("")}
        ${st.problems.length ? `<p class="lead">${esc(st.problems.join(". "))}. Do laundry or unhide something.</p>` : w && !st.fits.length ? `<p class="lead">Nothing fits those rules right now.</p>` : ""}
        <div class="sheet-actions"><button class="btn ghost" data-s="close">Close</button><button class="btn" data-s="again" ${st.fits.length ? "" : "disabled"}>Show others</button></div>`;
    };
    const redo = () => { const y = sh.scrollTop; compute(); paint(); sh.scrollTop = y; };
    redo();
    loadWx().then(r => { if (r && !st.wx && !st.preset) { st.wx = r.wx; st.src = r.src; if (!sh.hidden) redo(); } else if (!r && !st.wx && !st.preset) { st.preset = "cool"; if (!sh.hidden) redo(); } });
    sh.onclick = e => {
      const b = e.target.closest("[data-s]"); if (!b) return;
      const a = b.dataset.s;
      if (a === "close") return closeSheet();
      if (a === "kind") { st.kind = b.dataset.k; st.salt = 0; st.shown = []; return redo(); }
      if (a === "wx") { st.preset = st.preset === b.dataset.k ? null : b.dataset.k; st.salt = 0; st.shown = []; return redo(); }
      if (a === "rain") { const w = weather(); st.rain = !(w && w.rain >= 50); st.salt = 0; st.shown = []; return redo(); }
      if (a === "again") { st.shown = st.shown.concat(st.fits.map(f => f.items)).slice(-12); st.salt++; return redo(); }
      if (a === "wear") {
        const f = st.fits[+b.dataset.i], occ = OCCASIONS.find(o => o[0] === st.kind);
        sh.onclick = null; return wearSheet({date: todayStr(), name: f.name, when: occ[1], items: bySlot(f.items), weather: weather(), kind: st.kind});
      }
    };
  });
}

function pickItem(sh, slot, current, done) {
  let f = slot || "all";
  const paint = () => {
    const list = items().filter(i => !i.avoid && i.code !== current && (f === "all" || i.slot === f))
      .sort((a, b) => isDirty(a.code) - isDirty(b.code));
    sh.innerHTML = `<div class="grab"></div><h2>${current ? "Swap for…" : "Add a piece"}</h2>
      <div class="filters">${[["all", "All"], ...SLOTS].map(([k, l]) => `<button class="chip" aria-pressed="${f === k}" data-pf="${k}">${l}</button>`).join("")}</div>
      <div class="picker">${list.map(i => `<button data-pick="${i.code}" class="${isDirty(i.code) ? "dirty" : ""}"><span class="sw" style="--fc:${fcOf(i.code)}">${img(i.photo, "", rawCls(i.photo))}</span><span>${esc(i.name)}${isDirty(i.code) ? " · hamper" : ""}</span></button>`).join("")}</div>
      <div class="sheet-actions"><button class="btn ghost" data-pb>Back</button></div>`;
  };
  paint();
  sh.onclick = e => {
    const p = e.target.closest("[data-pick]"), pf = e.target.closest("[data-pf]");
    if (pf) { f = pf.dataset.pf; return paint(); }
    if (p || e.target.closest("[data-pb]")) { sh.onclick = sh.onchange = null; done(p ? p.dataset.pick : null); sh.scrollTop = 0; }
  };
  sh.onchange = null; sh.scrollTop = 0;
}

function itemSheet(code) {
  const it = item(code), worn = (S.log?.worn || []).filter(x => x.items.includes(code));
  const lim = (S.laundry?.wash_after || {})[it.type] || 0, w = wearsSinceWash(code);
  const pool = poolSize(code), used = pool ? pairsUsed(code) : 0;
  openSheet(`<div class="item-hero"><span class="ph" style="--fc:${fcOf(code)}">${img(it.photo, it.name, rawCls(it.photo))}</span><div><h2>${esc(it.name)}</h2>
      <p class="lead">${esc(it.colour)} · ${esc(TYPE_LABEL[it.type] || it.type)}</p>
      <p class="lead">Worn ${worn.length} time${worn.length === 1 ? "" : "s"}${worn[0] ? `, last ${new Date(worn[0].date + "T12:00").toLocaleDateString("en-US", {month:"short", day:"numeric"})}` : ""}.</p>
      ${pool ? `<p class="lead"><b>${pool - used}</b> of ${pool} pairs clean${used ? ` · ${used} in the hamper` : ""}.</p>
        <div class="stepper"><span class="lead" style="margin:0">Pairs owned</span><button class="btn small ghost" data-i="qty-" aria-label="One fewer pair">−</button><b>${pool}</b><button class="btn small ghost" data-i="qty+" aria-label="One more pair">+</button></div>`
      : manualDirty(code) ? `<p class="lead">In the hamper (you put it there).</p>`
        : lim ? `<p class="lead">${isDirty(code) ? `In the hamper after ${w} wear${w === 1 ? "" : "s"}.` : `${w} of ${lim} wears before the hamper.`}</p>` : ""}</div></div>
    <div class="sheet-actions">${pool ? (used ? `<button class="btn" data-i="wash">Washed all pairs</button>` : "") : isDirty(code) || (lim && w) ? `<button class="btn" data-i="wash">Mark washed</button>` : ""}
      ${!pool && !isDirty(code) ? `<button class="btn" data-i="hamper">Put in hamper</button>` : ""}
      <button class="btn ${it.avoid ? "primary" : "ghost"}" data-i="avoid">${it.avoid ? "Put back in rotation" : "Hide from fits"}</button></div>`,
    sh => {
      sh.onclick = e => {
        const b = e.target.closest("[data-i]"); if (!b) return;
        if (b.dataset.i === "wash") { run("washItem", {code, at: nowIso()}); toast(`${it.name} washed`); }
        if (b.dataset.i === "hamper") { run("hamperItem", {code, at: nowIso()}); toast(`${it.name} is in the hamper`); }
        if (b.dataset.i === "qty+" || b.dataset.i === "qty-") {
          const q = Math.max(2, pool + (b.dataset.i === "qty+" ? 1 : -1));   // stays a pool; below 2 it would stop being one
          run("setItem", {code, patch:{qty: q}}); toast(`${q} pairs`); return itemSheet(code);
        }
        if (b.dataset.i === "avoid") { run("setItem", {code, patch:{avoid: !it.avoid}}); toast(it.avoid ? "Hidden from fits" : "Back in rotation"); }
        closeSheet();
      };
    });
}

function addItemSheet() {
  const st = {blob:null, url:""};
  const paint = sh => {
    const keep = ["a-name", "a-colour", "a-type"].map(id => $("#" + id, sh)?.value);
    sh.innerHTML = `<div class="grab"></div><h2>Add a piece</h2><p class="lead">Lay it flat and shoot straight down, like the rest of the closet.</p>
      <div class="photo-pick">${st.url ? `<img src="${esc(st.url)}" alt="">` : ""}<label class="btn small">${st.url ? "Retake" : "Take or choose photo"}<input type="file" accept="image/*" id="a-photo" class="sr"></label></div>
      <label class="f">Name<input id="a-name" placeholder="e.g. Waffle henley"></label>
      <label class="f">Colour<input id="a-colour" placeholder="e.g. oatmeal"></label>
      <label class="f">Type<select id="a-type">${Object.entries(TYPE_LABEL).map(([k, l]) => `<option value="${k}">${l}</option>`).join("")}</select></label>
      <p id="a-err" class="err" hidden></p>
      <div class="sheet-actions"><button class="btn ghost" data-a="cancel">Cancel</button><button class="btn primary" data-a="save">Add to closet</button></div>`;
    ["a-name", "a-colour", "a-type"].forEach((id, i) => { if (keep[i] != null) $("#" + id, sh).value = keep[i]; });
  };
  openSheet("", sh => {
    paint(sh);
    sh.onchange = async e => { if (e.target.id === "a-photo" && e.target.files[0]) { st.blob = await compress(e.target.files[0], 900); st.url = URL.createObjectURL(st.blob); paint(sh); } };
    sh.onclick = async e => {
      const b = e.target.closest("[data-a]"); if (!b) return;
      if (b.dataset.a === "cancel") return closeSheet();
      const name = $("#a-name", sh).value.trim(), colour = $("#a-colour", sh).value.trim(), type = $("#a-type", sh).value;
      const err = $("#a-err", sh);
      if (!st.blob || !name || !colour) { err.hidden = false; err.textContent = "Add a photo, a name and a colour."; return; }
      const id = Math.random().toString(36).slice(2, 8), path = `photos/items/${todayStr()}_${id}.jpg`;
      imgCache.set(path, st.url);
      run("addItem", {item:{code:null, name, colour, type, slot: TYPES[type], avoid:false, uncalibrated:false, photo: path, added: todayStr()},
        upload:{path, b64: await blobToB64(st.blob)}});
      closeSheet(); toast(`${name} added. It can show up in tomorrow's fits.`);
    };
  });
}

function tweak(f, plan) {
  const list = f.items.map(c => `${item(c)?.name} (${item(c)?.colour}, ${c})`).join(", ");
  const text = `Tweak today's fit from my Rail morning sheet. ${plan.subtitle}\nFit ${f.n} "${f.name}" (${f.when}): ${list}.\nUse only my Provo closet (claude/fit-sheet + the-rail-data). Change it so: `;
  try { navigator.clipboard.writeText(text); } catch {}
  window.open(`https://claude.ai/new?q=${encodeURIComponent(text)}`, "_blank", "noopener");
}

/* ---------------- events ---------------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab]");
  if (t) {
    if (tab === t.dataset.tab) return;
    tab = t.dataset.tab; render(); scrollTo(0, 0);
    if (window.SX) SX.enter("#view", null, "up");     // the new tab settles in; sync redraws stay still
    return;
  }
  const lk = e.target.closest("[data-look]");
  if (lk) return goLook(+lk.dataset.look);
  const fl = e.target.closest("[data-filter]");
  if (fl) {                                          // pieces glide into their filtered spots
    closetFilter = closetFilter === fl.dataset.filter && fl.dataset.filter.startsWith("#") ? "all" : fl.dataset.filter;
    window.SX ? SX.flip("#view", ".grid .piece", render) : render();
    return;
  }
  const a = e.target.closest("#view [data-act]"); if (!a) return;
  const plan = todayPlan(), act = a.dataset.act;
  if (act === "wear") { const f = plan.fits.find(x => x.n === +a.dataset.n); return wearSheet({date: plan.date, name: f.name, when: f.when, items: f.items, n: f.n}); }
  if (act === "tweak") return tweak(plan.fits.find(x => x.n === +a.dataset.n), plan);
  if (act === "log-own") return buildFit();
  if (act === "suggest") return suggestSheet();
  if (act === "laundry") {
    if (a.dataset.armed) { run("laundry", {at: nowIso()}); if (window.SX) SX.bump(".hamper"); return toast("Hamper emptied"); }
    const label = a.textContent;
    a.dataset.armed = 1; a.textContent = "Tap again to empty"; a.classList.add("warn");
    setTimeout(() => { if (a.isConnected) { delete a.dataset.armed; a.textContent = label; a.classList.remove("warn"); } }, 3000); return;
  }
  if (act === "wash-load") {
    const at = nowIso(), codes = a.dataset.codes.split(",").filter(Boolean);
    codes.forEach(code => run("washItem", {code, at}));
    return toast(`${codes.length} piece${codes.length === 1 ? "" : "s"} washed`);
  }
  if (act === "month") { diaryOff = Math.max(0, diaryOff + +a.dataset.m); render(); return; }
  if (act === "day") { const el = document.getElementById("e-" + a.dataset.d); if (el) el.scrollIntoView({behavior: "smooth", block: "start"}); return; }
  if (act === "build-with") return buildFit({items: [a.dataset.code]});
  if (act === "item") return itemSheet(a.dataset.code);
  if (act === "add-item") return addItemSheet();
  if (act === "signout") {
    if (queue.length && isAccount()) return toast(`${queue.length} change(s) haven't synced yet. Get online first.`);
    try { window.google?.accounts?.id?.disableAutoSelect(); } catch {}
    const wasAccount = isAccount();
    Object.assign(cfg, {session: "", me: null}); ls("rail.cfg", cfg); invites = null;
    if (wasAccount) resetLocal();
    render(); return toast("Signed out");
  }
  if (act === "export") {
    a.disabled = true;
    try { const j = await API.json("/export"); download(`rail-export-${todayStr()}.json`, JSON.stringify(j, null, 1)); toast("Downloaded"); }
    catch (err) { toast(err.message); }
    a.disabled = false; return;
  }
  if (act === "delete-acct") {
    if (a.dataset.armed !== "1") { a.dataset.armed = "1"; a.textContent = "Tap again to delete for good"; a.classList.add("danger"); return; }
    a.disabled = true;
    try { await API.json("/me", "DELETE"); Object.assign(cfg, {session: "", me: null}); ls("rail.cfg", cfg); resetLocal(); render(); toast("Account deleted"); }
    catch (err) { a.disabled = false; toast(err.message); }
    return;
  }
  if (act === "invite") {
    const inp = $("#inv-email"), msg = $("#inv-msg"), email = inp.value.trim();
    if (!email) return inp.focus();
    a.disabled = true;
    try { await API.json("/invites", "POST", {email}); inp.value = ""; await loadInvites(); toast("Invited. Send them the link."); }
    catch (err) { msg.hidden = false; msg.textContent = err.message; a.disabled = false; }
    return;
  }
  if (act === "uninvite") {
    try { await API.json("/invites?email=" + encodeURIComponent(a.dataset.email), "DELETE"); await loadInvites(); } catch (err) { toast(err.message); }
    return;
  }
  if (act === "share-invite") {
    const link = new URL("./", location.href).href;
    const text = `You're invited to The Rail, my outfit app. Open ${link} on your phone, tap the gear, and sign in with Google (${a.dataset.email}). Add it to your home screen from the share menu.`;
    try { if (navigator.share) { await navigator.share({title: "The Rail", text}); return; } } catch { return; }
    try { await navigator.clipboard.writeText(text); toast("Invite copied"); } catch { toast(link); }
    return;
  }
  if (act === "resync") { await flush(); if (!queue.length) { await pull().catch(() => {}); render(); toast("Synced"); } return; }
  if (act === "save-cfg") {
    if (isAccount() && queue.length) return toast(`${queue.length} change(s) haven't synced yet. Get online first.`);
    if (isAccount()) { resetLocal(); Object.assign(cfg, {mode: "github", session: "", me: null}); }
    Object.assign(cfg, {owner: $("#s-owner").value.trim(), repo: $("#s-repo").value.trim(), token: $("#s-token").value.trim()});
    const msg = $("#cfg-msg"); a.disabled = true; a.textContent = "Connecting…";
    try {
      await GH.getJson("wardrobe.json").then(r => { if (!r.data) throw new GhError(404, "wardrobe.json isn't in that repo yet"); });
      ls("rail.cfg", cfg); await pull(); online = true; tab = "today"; render(); toast("Connected"); flush();
    } catch (err) {
      msg.hidden = false; a.disabled = false; a.textContent = "Save and connect";
      msg.textContent = err.status === 401 ? "GitHub rejected that token. Paste it again, or make a new one."
        : err.status === 404 ? `Can't find ${cfg.owner}/${cfg.repo} with this token. Check the name and that the token includes that repo.`
        : err.status === 0 ? "No connection. Try again when you're online." : err.message;
    }
  }
});
window.addEventListener("online", () => { online = true; flush(); });
window.addEventListener("offline", () => { online = false; setSync(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && configured()) { if (queue.length) flush(); else pull().then(render).catch(() => {}); } });

/* ---------------- boot ---------------- */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
render();
if (configured()) (queue.length ? flush() : pull().then(() => { online = true; render(); })).catch(e => { online = e.status !== 0; render(); });
// Account tokens last 30 days; every visit swaps in a fresh one (and picks up name or owner changes).
if (cfg.session) API.json("/me").then(j => { Object.assign(cfg, {session: j.token, me: j.me}); ls("rail.cfg", cfg); }).catch(e => { if (e.status === 401) render(); });
</script>
<!-- ===== New-version bar (same idea as Kitchen, Grocery, Protocol) =====
     Shortly after load, whenever you come back to the app, and every 10 min while it's open,
     the page fetches the live index.html (skipping every cache) and reads its VERSION.
     If the live one is NEWER than the one running, one bar slides down with a Reload button.
     Only ever one bar: a single fixed element, one check in flight at a time, newer-only
     (so a stale CDN copy can't trigger it), and Not now hides that version for this session. -->
<div class="updbar" id="updbar" hidden role="status">
  <div class="updin"><span class="upddot" aria-hidden="true"></span><span class="updtxt" id="updtxt">New version ready</span>
    <button class="updgo" id="updgo" type="button">Reload</button>
    <button class="updx" id="updx" type="button" aria-label="Not now"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
</div>
<style>
  .updbar{position:fixed;left:0;right:0;top:0;z-index:200;padding:calc(10px + var(--safe-t)) 16px 0;pointer-events:none}
  .updbar[hidden]{display:none}
  .updin{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px;height:50px;padding:0 6px 0 16px;box-sizing:border-box;
    border-radius:25px;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18);pointer-events:auto;
    transform:translateY(calc(-100% - 40px));transition:transform .4s cubic-bezier(.2,.8,.2,1), scale .2s cubic-bezier(.3,1.35,.5,1)}
  .updbar.up .updin{transform:none}
  .upddot{width:8px;height:8px;border-radius:4px;background:var(--sage);flex:0 0 auto;box-shadow:0 0 0 4px color-mix(in srgb,var(--sage) 22%,transparent)}
  .updtxt{flex:1;min-width:0;font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .updgo{height:38px;padding:0 18px;border:0;border-radius:19px;background:var(--sage);color:var(--sage-ink);font:inherit;font-size:14px;font-weight:800;cursor:pointer}
  .updgo:active{scale:.96}
  .updgo:disabled{opacity:.6}
  .updx{width:38px;height:38px;border:0;border-radius:19px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
  .updx svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
  @media (prefers-reduced-motion: reduce){ .updin{transition:none} }
</style>
<script>
(function(){
  if (window.__railUpd) return; window.__railUpd = true;          // never wire it up twice
  var U = {last:0, busy:false, dismissed:null, shown:null, tag:null, miss:0, noTag:false};
  var RE = /const\s+VERSION\s*=\s*"(\d{4}\.\d\d\.\d\d-[a-z]+)"/;
  function newer(a, b){ return a > b; }                          // YYYY.MM.DD-letter sorts as text
  /* Checked every 30 seconds while the app is open. A look is a HEAD request (headers only, about half a KB):
     the page's ETag is remembered from the last full read, and the whole page is downloaded again only when
     that tag changes. If the server gives no tag, it goes back to a full read every 5 minutes. */
  function check(force){
    if (!/^https?:$/.test(location.protocol) || !window.fetch || U.busy) return;
    if (!force && Date.now() - U.last < (U.tag ? 20e3 : 5*60e3)) return;
    U.busy = true; U.last = Date.now();
    var url = location.pathname + "?_=" + Date.now(), viaTag = !force && !!U.tag;
    var look = viaTag
      ? fetch(url, {method:"HEAD", cache:"no-store"}).then(function(r){ var t = r.ok && (r.headers.get("etag") || r.headers.get("last-modified")); return !!t && t === U.tag; }).catch(function(){ return false; })
      : Promise.resolve(false);
    look.then(function(same){
      if (same) { U.miss = 0; return; }
      return fetch(url, {cache:"no-store"})
        .then(function(r){ if (!r.ok) return null; U.tag = U.noTag ? null : (r.headers.get("etag") || r.headers.get("last-modified") || null); return r.text(); })
        .then(function(html){
          var m = html && html.match(RE);
          /* the tag changed but the version did not: twice running means the tag is not reliable here */
          if (viaTag && m && m[1] === VERSION) { if (++U.miss >= 2) { U.noTag = true; U.tag = null; } }
          if (!m || !newer(m[1], VERSION) || m[1] === U.dismissed || m[1] === U.shown) return;
          show(m[1]);
        });
    }).catch(function(){}).then(function(){ U.busy = false; });
  }
  function show(ver){
    U.shown = ver;
    document.getElementById("updtxt").textContent = "Rail " + ver + " ready";
    var b = document.getElementById("updbar"); b.hidden = false;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ b.classList.add("up"); }); });
  }
  document.getElementById("updgo").addEventListener("click", function(){
    this.disabled = true;                                          // one tap, one reload
    location.replace(location.pathname + "?v=" + Date.now() + location.hash);
  });
  document.getElementById("updx").addEventListener("click", function(){
    U.dismissed = U.shown; var b = document.getElementById("updbar");
    b.classList.remove("up"); setTimeout(function(){ b.hidden = true; }, 420);
  });
  if (/[?&]v=\d+/.test(location.search)) try { history.replaceState(null, "", location.pathname + location.hash); } catch(e) {}
  setTimeout(function(){ check(true); }, 2500);
  document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") check(false); });
  setInterval(function(){ if (document.visibilityState === "visible") check(false); }, 30e3);
})();
</script>
</body>
